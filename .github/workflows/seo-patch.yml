name: Patch SEO Test Workflow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch noindex guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/seo-test.yml')
          text = path.read_text(encoding='utf-8')
          old = '''              write_sitemap(all_urls)\n              validate(all_urls, current_events, artists)'''
          new = '''              write_sitemap(all_urls)\n\n              # Guardrail: every HTML page in the test deployment must be noindex, including copied legacy pages.\n              for html_file in OUT.rglob("*.html"):\n                  html_text = html_file.read_text(encoding="utf-8", errors="ignore")\n                  if 'name="robots"' not in html_text:\n                      html_text = html_text.replace("<head>", '<head>\\n          <meta name="robots" content="noindex,nofollow">', 1)\n                      html_file.write_text(html_text, encoding="utf-8")\n\n              validate(all_urls, current_events, artists)'''
          if old not in text:
              raise SystemExit('Target block not found; workflow not changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/seo-test.yml
          git commit -m "Fix test noindex validation [skip ci]"
          git push origin HEAD:main
