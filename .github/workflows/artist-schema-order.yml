name: Align Artist SEO Schema With Public Directory

on:
  workflow_run:
    workflows: ["Sync Current Live Site Into Public Test Tree"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: kingdom-circuit-artist-schema-order
  cancel-in-progress: true

jobs:
  align:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout synchronized test tree
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Align ItemList schema to visible live artist order
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import html
          import json
          import pathlib
          import re

          path = pathlib.Path('artists/index.html')
          text = path.read_text(encoding='utf-8')

          cards = re.findall(
              r'<article class="artist-card seo-artist-card".*?<h2><a href="([^"]+)">(.*?)</a></h2>',
              text,
              flags=re.S,
          )
          if len(cards) < 250:
              raise SystemExit(f'Expected at least 250 visible artist cards; found {len(cards)}')

          ordered = []
          for href, raw_name in cards:
              name = html.unescape(re.sub(r'<[^>]+>', '', raw_name)).strip()
              ordered.append({
                  '@type': 'ListItem',
                  'position': len(ordered) + 1,
                  'url': 'https://84lorinw-a11y.github.io' + href,
                  'name': name,
              })

          script_re = re.compile(r'(<script type="application/ld\+json">)(.*?)(</script>)', re.S)
          changed = False

          def replace(match):
              global changed
              try:
                  data = json.loads(match.group(2))
              except json.JSONDecodeError:
                  return match.group(0)
              if data.get('@type') != 'ItemList' or data.get('name') != 'Christian Hip-Hop Artists':
                  return match.group(0)
              data['itemListElement'] = ordered
              changed = True
              return match.group(1) + json.dumps(data, separators=(',', ':'), ensure_ascii=False).replace('</', '<\\/') + match.group(3)

          updated = script_re.sub(replace, text)
          if not changed:
              raise SystemExit('Christian Hip-Hop Artists ItemList schema was not found')

          path.write_text(updated, encoding='utf-8')

          check = path.read_text(encoding='utf-8')
          schema_match = next(
              (m for m in script_re.finditer(check) if '"@type":"ItemList"' in m.group(2) and 'Christian Hip-Hop Artists' in m.group(2)),
              None,
          )
          if not schema_match:
              raise SystemExit('Aligned ItemList schema missing after write')
          schema = json.loads(schema_match.group(2))
          schema_names = [x.get('name') for x in schema.get('itemListElement', [])]
          visible_names = [x['name'] for x in ordered]
          if schema_names != visible_names:
              raise SystemExit('Schema artist order does not match visible artist order')
          if visible_names[:10] != ['Lecrae','Hulvey','KB','Caleb Gordon','Andy Mineo','nobigdyl.','1K Phew','Miles Minnick','Jon Keith','Tedashii']:
              raise SystemExit(f'Unexpected first ten artists: {visible_names[:10]}')
          print('Artist ItemList schema aligned:', visible_names[:10])
          PY

      - name: Commit schema alignment when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- artists/index.html; then
            echo "Artist schema already matches visible live order."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artists/index.html
          git commit -m "Align artist directory schema with live order"
          git push origin HEAD:main
