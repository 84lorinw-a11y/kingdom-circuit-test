name: Fix SEO Regression Pipe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-pipefix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fix broken-pipe regression command
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/seo-test.yml')
          text = path.read_text(encoding='utf-8')
          old = "SAMPLE_EVENT=$(find _site/event -mindepth 2 -maxdepth 2 -name index.html | head -1 | sed 's#_site/##;s#index.html##')"
          new = "SAMPLE_EVENT=$(find _site/event -mindepth 2 -maxdepth 2 -name index.html -print -quit | sed 's#_site/##;s#index.html##')"
          if old not in text:
              raise SystemExit('Target command not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/seo-test.yml
          git commit -m "Fix SEO regression broken pipe"
          git push origin HEAD:main
