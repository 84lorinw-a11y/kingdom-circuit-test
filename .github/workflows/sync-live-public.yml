name: Sync Current Live Site Into Public Test Tree

on:
  push:
    branches: [main]
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kingdom-circuit-test-public-sync
  cancel-in-progress: true

env:
  LIVE_REPO: 84lorinw-a11y/kingdom-circuit

jobs:
  sync:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Checkout current live repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.LIVE_REPO }}
          ref: main
          path: _live
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build current live production artifact
        shell: bash
        run: |
          set -euo pipefail
          cd _live
          python -m unittest discover -s tests -p 'test_*.py' -v

          rm -rf _site
          mkdir -p _site/config
          cp index.html styles.css app.js events.json run-status.json \
             supplemental-events.json 404.html robots.txt sitemap.xml _site/
          cp config/artists.json _site/config/artists.json
          cp -R shows festivals new-shows artists event submit assets _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi

          python scripts/build_seo_site.py
          python scripts/verify_multipage_site.py _site

      - name: Convert live artifact to safe GitHub Pages test paths
        shell: bash
        run: |
          set -euo pipefail
          LIVE_SHA=$(git -C _live rev-parse HEAD)
          TEST_SHA=$(git rev-parse HEAD)
          CACHE_TOKEN="${LIVE_SHA:0:12}-${TEST_SHA:0:12}"
          rm -rf _public_sync _prod_reference
          python scripts/mirror_live_baseline.py \
            _live/_site _prod_reference _public_sync "$LIVE_SHA" "$CACHE_TOKEN"

      - name: Apply approved SEO test overlay
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/apply_test_overlay.py scripts/finalize_test_seo.py scripts/align_artist_schema.py
          python scripts/apply_test_overlay.py _public_sync
          python scripts/finalize_test_seo.py _public_sync
          python scripts/align_artist_schema.py _public_sync
          ! grep -R -q 'kingdom-circuit-test/kingdom-circuit-test/' _public_sync/artists _public_sync/shows _public_sync/event _public_sync/index.html _public_sync/sitemap.xml

      - name: Install browser test dependency
        run: python -m pip install --quiet selenium

      - name: Validate enhanced public tree in Chrome
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kc-public-host
          mkdir -p /tmp/kc-public-host/kingdom-circuit-test
          cp -a _public_sync/. /tmp/kc-public-host/kingdom-circuit-test/
          python3 -m http.server 8767 --directory /tmp/kc-public-host >/tmp/kc-public-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 1

          # HTTP validation proves the same tree is actually servable at the GitHub Pages-style subpath.
          curl --fail --silent --show-error http://127.0.0.1:8767/kingdom-circuit-test/artists/kb/index.html | grep -q 'KB Concerts &amp; Tour Dates'
          curl --fail --silent --show-error http://127.0.0.1:8767/kingdom-circuit-test/artists/index.html | grep -q 'data-seo-enhanced-directory'
          curl --fail --silent --show-error http://127.0.0.1:8767/kingdom-circuit-test/artists/kb/minnesota/index.html | grep -q 'KB Concerts in Minnesota'

          # Chrome validates the rendered DOM and the filter behavior directly from the generated files.
          python - <<'PY'
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait, Select

          ROOT=Path('/tmp/kc-public-host/kingdom-circuit-test').resolve()
          enhancements=(ROOT/'seo-test-enhancements.js').read_text(encoding='utf-8')
          opts=webdriver.ChromeOptions()
          opts.page_load_strategy='eager'
          opts.add_argument('--headless=new')
          opts.add_argument('--no-sandbox')
          opts.add_argument('--disable-dev-shm-usage')
          opts.add_argument('--window-size=1440,1200')
          opts.add_argument('--disable-background-networking')
          driver=webdriver.Chrome(options=opts)
          driver.set_page_load_timeout(20)

          def open_file(relative, bind_filters=False):
              driver.get((ROOT/relative).as_uri())
              WebDriverWait(driver,10).until(lambda d: d.find_elements(By.CSS_SELECTOR,'body'))
              if bind_filters:
                  driver.execute_script(enhancements + "\ndocument.dispatchEvent(new Event('DOMContentLoaded'));\n")

          try:
              open_file('artists/kb/index.html', bind_filters=True)
              assert 'Concerts & Tour Dates' in driver.find_element(By.CSS_SELECTOR,'h1').text
              assert len(driver.find_elements(By.CSS_SELECTOR,'.seo-social-link')) >= 4
              images=driver.find_elements(By.CSS_SELECTOR,'.seo-profile-image img')
              assert images and images[0].get_attribute('src')
              assert len(driver.find_elements(By.CSS_SELECTOR,'[data-event-card]')) == 4

              states=Select(driver.find_element(By.CSS_SELECTOR,'[data-artist-state-filter]'))
              assert any(o.get_attribute('value') == 'MN' for o in states.options)
              states.select_by_value('MN')
              WebDriverWait(driver,5).until(lambda d: len([x for x in d.find_elements(By.CSS_SELECTOR,'[data-event-card]') if x.is_displayed()]) == 1)

              open_file('artists/index.html')
              assert len(driver.find_elements(By.CSS_SELECTOR,'.seo-artist-card')) >= 250
              assert len(driver.find_elements(By.CSS_SELECTOR,'.seo-card-socials .seo-social-link')) >= 80

              open_file('artists/kb/minnesota/index.html')
              assert 'KB Concerts in Minnesota' in driver.find_element(By.CSS_SELECTOR,'h1').text
              assert len(driver.find_elements(By.CSS_SELECTOR,'[data-event-card]')) == 1

              open_file('shows/minnesota/index.html')
              assert 'Christian Hip-Hop' in driver.find_element(By.CSS_SELECTOR,'h1').text
              assert driver.find_elements(By.CSS_SELECTOR,'[data-event-card]')
          finally:
              driver.quit()
          print('Enhanced public-tree HTTP, DOM, and filter validation passed')
          PY

          kill "$PID"
          trap - EXIT

      - name: Replace checked-in public test tree with validated enhanced live mirror
        shell: bash
        run: |
          set -euo pipefail

          rm -rf shows festivals new-shows artists event submit assets config
          mkdir -p config

          cp _public_sync/index.html .
          cp _public_sync/styles.css .
          cp _public_sync/app.js .
          cp _public_sync/events.json .
          cp _public_sync/run-status.json .
          cp _public_sync/supplemental-events.json .
          cp _public_sync/404.html .
          cp _public_sync/robots.txt .
          cp _public_sync/sitemap.xml .
          cp _public_sync/test-live-mirror-manifest.json .
          cp _public_sync/seo-test-enhancements.js .
          cp _public_sync/seo-test-overlay-manifest.json .

          if [ -f _public_sync/seo-static.js ]; then cp _public_sync/seo-static.js .; fi
          if [ -f _public_sync/seo-build-manifest.json ]; then cp _public_sync/seo-build-manifest.json .; fi

          cp _public_sync/config/artists.json config/artists.json
          cp -R _public_sync/shows _public_sync/festivals _public_sync/new-shows \
                _public_sync/artists _public_sync/event _public_sync/submit _public_sync/assets ./

          if grep -R -nE 'app-v[0-9]+\.js|patch-v[0-9]+\.css|test-site-banner' \
               index.html shows festivals new-shows artists event submit; then
            echo "Old preview references remain in the public tree."
            exit 1
          fi

          grep -q 'name="robots" content="noindex,nofollow"' artists/index.html
          grep -q 'data-seo-enhanced-directory' artists/index.html
          grep -q 'KB Concerts &amp; Tour Dates' artists/kb/index.html
          grep -q '/kingdom-circuit-test/app.js' artists/index.html
          grep -q '/kingdom-circuit-test/styles.css' artists/index.html
          ! grep -R -q 'kingdom-circuit-test/kingdom-circuit-test/' artists shows event index.html sitemap.xml

      - name: Commit validated synchronized public test tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kingdom-circuit-test-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html styles.css app.js events.json run-status.json \
                  supplemental-events.json 404.html robots.txt sitemap.xml \
                  test-live-mirror-manifest.json seo-test-enhancements.js \
                  seo-test-overlay-manifest.json config shows festivals \
                  new-shows artists event submit assets
          if [ -f seo-static.js ]; then git add seo-static.js; fi
          if [ -f seo-build-manifest.json ]; then git add seo-build-manifest.json; fi

          if git diff --cached --quiet; then
            echo "Validated public test tree already matches current live + SEO overlay."
            exit 0
          fi

          git commit -m "Sync validated public test tree to live + SEO overlay"

          # Another status/maintenance workflow can update main while this run validates.
          # Rebase our generated public-tree commit onto the newest main before pushing.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Public-tree push raced with another workflow; retrying ($attempt/3)."
            sleep 2
          done

          echo "Unable to push validated public tree after three race-safe retries."
          exit 1
