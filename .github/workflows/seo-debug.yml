name: SEO Build Debug
# rerun 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-debug.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract and run SEO build
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path('.github/workflows/seo-test.yml').read_text(encoding='utf-8')
          start_marker = "          cat > /tmp/build_kc_seo.py <<'PY'\n"
          end_marker = "\n          PY\n          python /tmp/build_kc_seo.py"
          start = text.index(start_marker) + len(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/build_kc_seo.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          set +e
          python /tmp/build_kc_seo.py > seo-debug.log 2>&1
          code=$?
          set -e
          echo "__EXIT_CODE=$code" >> seo-debug.log
          cat seo-debug.log

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seo-debug.log
          git commit -m "Capture SEO build diagnostics [skip ci]" || true
          git push origin HEAD:main || true
          exit "$code"
