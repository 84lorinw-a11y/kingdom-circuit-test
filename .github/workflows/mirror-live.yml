name: Mirror Live Site to Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mirror-live.yml"
      - "scripts/capture_live_site.py"
      - "scripts/live_mirror_v2.py"
      - "scripts/verify_live_baseline.py"
      - "scripts/mobile_seo_preview.py"
      - "scripts/national_discovery_preview.py"
      - "scripts/apply_test_redesign.py"
      - "scripts/verify_test_redesign.py"
      - "scripts/build_mobile_show_test.py"
      - "scripts/build_artist_intake_mockup.py"
      - "scripts/build_chh_game.py"
      - "scripts/build_cloudflare_game.py"
      - "scripts/game_test_publish.py"
      - "scripts/finalize_artist_details.py"
      - "test-overrides/**"
      - "game-backend/**"
      - "tests/**"
  schedule:
    - cron: "0 8 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      mode:
        description: 'Full website refresh, or game update using the last verified website'
        type: choice
        required: true
        default: full-refresh
        options:
          - full-refresh
          - game-only

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kingdom-circuit-live-mirror
  cancel-in-progress: false

env:
  LIVE_REPO: 84lorinw-a11y/kingdom-circuit
  LIVE_SITE: https://kingdomcircuit.com

jobs:
  build:
    if: github.repository == '84lorinw-a11y/kingdom-circuit-test' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Choose full refresh or game-only publishing
        id: publishing
        run: python scripts/game_test_publish.py route

      - name: Find the last successfully published website snapshot
        if: steps.publishing.outputs.mode == 'game-only'
        id: last_publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/game_test_publish.py find

      - name: Read the last publication's website reference
        if: steps.publishing.outputs.mode == 'game-only'
        uses: actions/download-artifact@v4
        with:
          name: verified-website-reference
          run-id: ${{ steps.last_publication.outputs.published_run }}
          github-token: ${{ github.token }}
          path: _website_reference

      - name: Resolve the exact website snapshot to reuse
        if: steps.publishing.outputs.mode == 'game-only'
        id: snapshot
        run: python scripts/game_test_publish.py read-reference

      - name: Restore the verified website archive from GitHub cache
        if: steps.publishing.outputs.mode == 'game-only'
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.snapshot.outputs.cache_key }}
          path: _website_snapshot/website.zip
          fail-on-cache-miss: true

      - name: Restore the verified website without accessing production
        if: steps.publishing.outputs.mode == 'game-only'
        env:
          SNAPSHOT_RUN: ${{ steps.snapshot.outputs.run_id }}
          SNAPSHOT_SHA: ${{ steps.snapshot.outputs.sha }}
          SNAPSHOT_KEY: ${{ steps.snapshot.outputs.cache_key }}
        run: >-
          python scripts/game_test_publish.py restore
          --source-run "$SNAPSHOT_RUN" --source-commit "$SNAPSHOT_SHA" --source-key "$SNAPSHOT_KEY"

      - name: Resolve the currently deployed live revision
        if: steps.publishing.outputs.mode == 'full-refresh'
        id: live_deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API_PATH="repos/${LIVE_REPO}/actions/workflows/update-and-deploy.yml/runs?branch=main&per_page=20"
          if ! RESPONSE=$(gh api "$API_PATH"); then
            RESPONSE=$(curl -fsSL "https://api.github.com/$API_PATH")
          fi
          LIVE_SHA=$(jq -r \
            '.workflow_runs | map(select(.status == "completed" and .conclusion == "success"))[0].head_sha // empty' \
            <<<"$RESPONSE")
          LIVE_RUN_ID=$(jq -r \
            '.workflow_runs | map(select(.status == "completed" and .conclusion == "success"))[0].id // empty' \
            <<<"$RESPONSE")
          test -n "$LIVE_SHA"
          test -n "$LIVE_RUN_ID"
          echo "sha=$LIVE_SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$LIVE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Capturing successful live deployment $LIVE_RUN_ID at $LIVE_SHA"

      - name: Set up Node for game score-service tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify mirror harness
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/game_test_publish.py
          python -m py_compile scripts/capture_live_site.py
          python -m py_compile scripts/live_mirror_v2.py
          python -m py_compile scripts/verify_live_baseline.py
          python -m py_compile scripts/mobile_seo_preview.py
          python -m py_compile scripts/national_discovery_preview.py
          python -m py_compile scripts/apply_test_redesign.py
          python -m py_compile scripts/verify_test_redesign.py
          python -m py_compile scripts/build_mobile_show_test.py
          python -m py_compile scripts/build_artist_intake_mockup.py
          python -m py_compile scripts/build_chh_game.py
          python -m py_compile scripts/finalize_artist_details.py
          node --check test-overrides/mobile-show-test.js
          node --check test-overrides/artist-intake-mockup.js
          node --check test-overrides/mobile-seo-preview.js
          node --check test-overrides/national-discovery.js
          node --check test-overrides/fan-discovery.js
          node --test tests/artist-intake-submit.test.cjs
          node --test tests/mobile-seo-preview.test.cjs
          node --test tests/national-discovery.test.cjs
          node --test tests/fan-discovery.test.cjs
          for source in test-overrides/chh-show-night/*.mjs; do node --check "$source"; done
          node --test tests/chh-game/*.test.mjs
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Capture the exact published live site
        if: steps.publishing.outputs.mode == 'full-refresh'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/capture_live_site.py \
            "$LIVE_SITE" _live_site \
            --workers 16 \
            --min-html 800 \
            --min-files 900

      - name: Convert only the deployment identity for test
        if: steps.publishing.outputs.mode == 'full-refresh'
        shell: bash
        run: |
          set -euo pipefail
          LIVE_SHA="${{ steps.live_deployment.outputs.sha }}"
          LIVE_RUN_ID="${{ steps.live_deployment.outputs.run_id }}"
          python scripts/live_mirror_v2.py \
            _live_site _site "$LIVE_SHA" "$LIVE_RUN_ID"

          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/app.js
          test -s _site/config/artists.json
          test -s _site/seo-static.js
          test -s _site/seo-enhancements.js
          test -s _site/test-live-mirror-manifest.json
          test -f _site/.nojekyll
          test ! -e _site/CNAME
          test ! -e _site/artwork-audit.json
          test ! -e _site/run-status.json
          test ! -e _site/sep12-closeout-report.json
          test ! -e _site/seo-build-manifest.json
          test ! -e _site/seo-indexing-policy.json
          test ! -e _site/seo-overlay-manifest.json
          grep -q 'Disallow: /' _site/robots.txt
          grep -q 'name="robots" content="noindex,nofollow"' _site/index.html
          grep -q '/kingdom-circuit-test/styles.css' _site/index.html
          grep -Eq '/kingdom-circuit-test/(app|seo-static)\.js' _site/index.html
          grep -q '"mode": "exact-live-artifact-mirror"' _site/test-live-mirror-manifest.json
          grep -q "\"liveCommit\": \"$LIVE_SHA\"" _site/test-live-mirror-manifest.json
          grep -q "\"liveDeploymentRunId\": \"$LIVE_RUN_ID\"" _site/test-live-mirror-manifest.json

      - name: Preserve the separate show layout experiments
        if: steps.publishing.outputs.mode == 'full-refresh'
        run: python scripts/build_mobile_show_test.py _site --isolated

      - name: Build and verify artist intake mockup
        if: steps.publishing.outputs.mode == 'full-refresh'
        run: python scripts/build_artist_intake_mockup.py _site

      - name: Apply the approved test-only mobile SEO preview
        if: steps.publishing.outputs.mode == 'full-refresh'
        run: python scripts/mobile_seo_preview.py _site _live_site

      - name: Build the approved national discovery preview
        if: steps.publishing.outputs.mode == 'full-refresh'
        run: python scripts/national_discovery_preview.py _site _live_site

      - name: Verify the final deployment artifact
        run: |
          python scripts/build_chh_game.py _site
          python scripts/finalize_artist_details.py _site --check
          python scripts/verify_live_baseline.py _live_site _site

      - name: Verify game-only publishing preserved every website file
        if: steps.publishing.outputs.mode == 'game-only'
        run: python scripts/game_test_publish.py check

      - name: Seal the verified website for future game updates
        if: steps.publishing.outputs.mode == 'full-refresh'
        run: python scripts/game_test_publish.py seal

      - name: Save the reusable website snapshot
        if: steps.publishing.outputs.mode == 'full-refresh'
        uses: actions/cache/save@v4
        with:
          key: verified-test-website-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: _website_snapshot/website.zip

      - name: Confirm the new snapshot is available
        if: steps.publishing.outputs.mode == 'full-refresh'
        uses: actions/cache/restore@v4
        with:
          key: verified-test-website-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: _website_snapshot/website.zip
          lookup-only: true
          fail-on-cache-miss: true

      - name: Pin this publication to its verified website snapshot
        run: python scripts/game_test_publish.py write-reference

      - name: Save the small website reference for the next publication
        uses: actions/upload-artifact@v4
        with:
          name: verified-website-reference
          path: _website_reference/reference.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Record publishing mode
        env:
          PUBLISH_MODE: ${{ steps.publishing.outputs.mode }}
          SNAPSHOT_RUN: ${{ steps.snapshot.outputs.run_id }}
        run: |
          echo "### GitHub test publishing: $PUBLISH_MODE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PUBLISH_MODE" = game-only ]; then
            echo "Reused verified website from run $SNAPSHOT_RUN. No live-site capture. Website hashes unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Completed a full live-site refresh and saved a verified snapshot for game updates." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Cloudflare publishing settings and the production repository are unchanged." >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: https://84lorinw-a11y.github.io/kingdom-circuit-test/
    steps:
      - name: Deploy test site
        uses: actions/deploy-pages@v5
