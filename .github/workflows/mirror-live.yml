name: Mirror Live Site to Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mirror-live.yml"
      - "scripts/capture_live_site.py"
      - "scripts/live_mirror_v2.py"
      - "scripts/apply_test_redesign.py"
      - "scripts/verify_test_redesign.py"
      - "test-overrides/**"
      - "tests/**"
  schedule:
    - cron: "0 8 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kingdom-circuit-live-mirror
  cancel-in-progress: true

env:
  LIVE_REPO: 84lorinw-a11y/kingdom-circuit
  LIVE_SITE: https://kingdomcircuit.com

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v6

      - name: Resolve the currently deployed live revision
        id: live_deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API_PATH="repos/${LIVE_REPO}/actions/workflows/update-and-deploy.yml/runs?branch=main&per_page=20"
          if ! RESPONSE=$(gh api "$API_PATH"); then
            RESPONSE=$(curl -fsSL "https://api.github.com/$API_PATH")
          fi
          LIVE_SHA=$(jq -r \
            '.workflow_runs | map(select(.status == "completed" and .conclusion == "success"))[0].head_sha // empty' \
            <<<"$RESPONSE")
          LIVE_RUN_ID=$(jq -r \
            '.workflow_runs | map(select(.status == "completed" and .conclusion == "success"))[0].id // empty' \
            <<<"$RESPONSE")
          test -n "$LIVE_SHA"
          test -n "$LIVE_RUN_ID"
          echo "sha=$LIVE_SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$LIVE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Capturing successful live deployment $LIVE_RUN_ID at $LIVE_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify mirror harness
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/capture_live_site.py
          python -m py_compile scripts/live_mirror_v2.py
          python -m py_compile scripts/apply_test_redesign.py
          python -m py_compile scripts/verify_test_redesign.py
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Capture the exact published live site
        shell: bash
        run: |
          set -euo pipefail
          python scripts/capture_live_site.py \
            "$LIVE_SITE" _live_site \
            --workers 16 \
            --min-html 800 \
            --min-files 900

      - name: Convert only the deployment identity for test
        shell: bash
        run: |
          set -euo pipefail
          LIVE_SHA="${{ steps.live_deployment.outputs.sha }}"
          LIVE_RUN_ID="${{ steps.live_deployment.outputs.run_id }}"
          python scripts/live_mirror_v2.py \
            _live_site _site "$LIVE_SHA" "$LIVE_RUN_ID"

          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/app.js
          test -s _site/config/artists.json
          test -s _site/seo-static.js
          test -s _site/seo-enhancements.js
          test -s _site/test-live-mirror-manifest.json
          test -f _site/.nojekyll
          test ! -e _site/CNAME
          test ! -e _site/artwork-audit.json
          test ! -e _site/run-status.json
          test ! -e _site/sep12-closeout-report.json
          test ! -e _site/seo-build-manifest.json
          test ! -e _site/seo-indexing-policy.json
          test ! -e _site/seo-overlay-manifest.json
          grep -q 'Disallow: /' _site/robots.txt
          grep -q 'name="robots" content="noindex,nofollow"' _site/index.html
          grep -q '/kingdom-circuit-test/styles.css' _site/index.html
          grep -q '/kingdom-circuit-test/app.js' _site/index.html
          grep -q '"mode": "exact-live-artifact-mirror"' _site/test-live-mirror-manifest.json
          grep -q "\"liveCommit\": \"$LIVE_SHA\"" _site/test-live-mirror-manifest.json
          grep -q "\"liveDeploymentRunId\": \"$LIVE_RUN_ID\"" _site/test-live-mirror-manifest.json

      - name: Apply and verify the mobile-first test redesign
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply_test_redesign.py _site
          python scripts/verify_test_redesign.py _site

          test -s _site/assets/kc-redesign-v1.css
          test -s _site/assets/kc-redesign-v1.js
          test -s _site/test-redesign-manifest.json
          test -s _site/submit/artist/index.html
          grep -q '"mode": "live-baseline-with-test-redesign"' _site/test-live-mirror-manifest.json
          grep -q '"mode": "mobile-first-test-redesign-v1"' _site/test-redesign-manifest.json
          grep -q 'class="kc-rd-home-title"' _site/index.html
          grep -q 'class="kc-rd-directory-intro"' _site/artists/index.html
          grep -q 'data-kc-artist-submit-form' _site/submit/artist/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: https://84lorinw-a11y.github.io/kingdom-circuit-test/
    steps:
      - name: Deploy test site
        uses: actions/deploy-pages@v5
