name: Mirror Live Site to Test

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kingdom-circuit-live-mirror
  cancel-in-progress: true

env:
  LIVE_REPO: 84lorinw-a11y/kingdom-circuit
  TEST_BASE: /kingdom-circuit-test/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout minimal test harness
        uses: actions/checkout@v6

      - name: Checkout current live repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.LIVE_REPO }}
          ref: main
          path: _live
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify current live source
        shell: bash
        run: |
          set -euo pipefail
          cd _live
          python -m unittest discover -s tests -p 'test_*.py' -v
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s events.json
          test -s config/artists.json
          test -s scripts/build_seo_site.py
          test -s scripts/verify_multipage_site.py

      - name: Build exactly what production builds
        shell: bash
        run: |
          set -euo pipefail
          cd _live
          rm -rf _site
          mkdir -p _site/config

          cp index.html styles.css app.js events.json run-status.json \
             supplemental-events.json 404.html robots.txt sitemap.xml _site/
          cp config/artists.json _site/config/artists.json
          cp -R shows festivals new-shows artists event submit assets _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi

          python scripts/build_seo_site.py
          python scripts/verify_multipage_site.py _site

      - name: Convert production artifact to safe test paths
        shell: bash
        run: |
          set -euo pipefail
          LIVE_SHA=$(git -C _live rev-parse HEAD)
          python -m py_compile scripts/live_mirror_v2.py
          python scripts/live_mirror_v2.py _live/_site _site "$LIVE_SHA"

      - name: Verify baseline-only mirror
        shell: bash
        run: |
          set -euo pipefail
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/app.js
          test -s _site/config/artists.json
          test -s _site/test-live-mirror-manifest.json
          test ! -e _site/CNAME
          test ! -e _site/seo-phase2.css
          test ! -e _site/seo-phase2.js
          test ! -e _site/seo-test-enhancements.js
          grep -q '"mode": "live-baseline-only"' _site/test-live-mirror-manifest.json
          grep -q '"seoPhase2OverlayApplied": false' _site/test-live-mirror-manifest.json
          grep -q 'Disallow: /' _site/robots.txt
          grep -q 'name="robots" content="noindex,nofollow"' _site/index.html
          grep -q '/kingdom-circuit-test/styles.css' _site/index.html
          grep -q '/kingdom-circuit-test/app.js' _site/index.html
          grep -q 'const BASE = "/kingdom-circuit-test/";' _site/app.js
          cmp _live/_site/styles.css _site/styles.css
          cmp _live/_site/events.json _site/events.json
          cmp _live/_site/config/artists.json _site/config/artists.json

      - name: Install browser test dependency
        run: python -m pip install --quiet selenium

      - name: Browser smoke-test live visual/runtime behavior
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kc-test-host
          mkdir -p /tmp/kc-test-host/kingdom-circuit-test
          cp -a _site/. /tmp/kc-test-host/kingdom-circuit-test/
          python3 -m http.server 8765 --directory /tmp/kc-test-host >/tmp/kc-test-http.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          sleep 1

          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          BASE='http://127.0.0.1:8765/kingdom-circuit-test/'
          options=webdriver.ChromeOptions()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1440,1100')
          driver=webdriver.Chrome(options=options)
          wait=WebDriverWait(driver,20)
          try:
              driver.get(BASE)
              wait.until(lambda d: d.find_elements(By.CSS_SELECTOR,'.site-header .brand img'))
              assert driver.find_element(By.CSS_SELECTOR,'.site-header .brand img').get_attribute('src').endswith('/kingdom-circuit-test/assets/logo.png')
              assert 'TEST SITE' not in driver.page_source

              driver.get(BASE+'artists/')
              wait.until(lambda d: len(d.find_elements(By.CSS_SELECTOR,'.artist-card')) >= 250)
              cards=driver.find_elements(By.CSS_SELECTOR,'.artist-card')
              assert len(cards) >= 250
              # The live artist registry enriches verified artists with images and social links.
              assert len(driver.find_elements(By.CSS_SELECTOR,'.artist-card img')) >= 30
              instagram=[a for a in driver.find_elements(By.CSS_SELECTOR,'.artist-card a[href*="instagram.com"]')]
              assert len(instagram) >= 30

              driver.get(BASE+'shows/')
              wait.until(lambda d: d.find_elements(By.CSS_SELECTOR,'.event-card'))
              assert driver.find_elements(By.CSS_SELECTOR,'.filter-dock')

              metrics=driver.execute_script('return {inner:window.innerWidth,body:document.body.scrollWidth,doc:document.documentElement.scrollWidth};')
              assert max(metrics['body'],metrics['doc']) <= metrics['inner'] + 2, metrics
          finally:
              driver.quit()
          print('Live baseline browser smoke tests passed')
          PY

          kill "$PID"
          trap - EXIT

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload mirrored live artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: https://84lorinw-a11y.github.io/kingdom-circuit-test/
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy mirrored live site
        uses: actions/deploy-pages@v5
