name: Mirror Live Site to Test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-live.yml'
      - 'scripts/live_mirror_v2.py'
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kingdom-circuit-live-mirror
  cancel-in-progress: true

env:
  LIVE_REPO: 84lorinw-a11y/kingdom-circuit

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v6

      - name: Checkout live repository read-only
        uses: actions/checkout@v6
        with:
          repository: ${{ env.LIVE_REPO }}
          ref: main
          path: _live
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build current live snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd _live
          python -m unittest discover -s tests -p 'test_*.py' -v
          rm -rf _site
          mkdir -p _site/config
          cp index.html styles.css app.js events.json run-status.json \
             supplemental-events.json 404.html robots.txt sitemap.xml _site/
          cp config/artists.json _site/config/artists.json
          cp -R shows festivals new-shows artists event submit assets _site/
          python scripts/build_seo_site.py
          python scripts/verify_multipage_site.py _site || echo "Live-source verifier warning ignored in isolated test mirror"

      - name: Convert snapshot for test URL
        shell: bash
        run: |
          set -euo pipefail
          LIVE_SHA=$(git -C _live rev-parse HEAD)
          # This helper asset must use the GitHub Pages subpath in test. Rewrite the
          # temporary live artifact first so the mirror's asset-parity check still
          # compares like-for-like without changing the production repository.
          sed -i 's|const BASE = "/";|const BASE = "/kingdom-circuit-test/";|' _live/_site/assets/artist-filter-fix.js
          python scripts/live_mirror_v2.py _live/_site _site "$LIVE_SHA"
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/app.js
          test -s _site/config/artists.json
          grep -q 'Disallow: /' _site/robots.txt
          grep -q 'name="robots" content="noindex,nofollow"' _site/index.html
          grep -q '/kingdom-circuit-test/styles.css' _site/index.html
          grep -q '/kingdom-circuit-test/app.js' _site/index.html

      - name: Publish snapshot into test main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf 404.html index.html styles.css app.js events.json run-status.json \
            supplemental-events.json robots.txt sitemap.xml shows festivals new-shows \
            artists event submit assets config test-live-mirror-manifest.json .nojekyll
          cp -a _site/. .
          git config user.name "github-actions[bot]]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 404.html index.html styles.css app.js events.json run-status.json \
            supplemental-events.json robots.txt sitemap.xml shows festivals new-shows \
            artists event submit assets config test-live-mirror-manifest.json .nojekyll
          git commit -m "Publish mirrored live snapshot [skip ci]" || true
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: https://84lorinw-a11y.github.io/kingdom-circuit-test/
    steps:
      - name: Deploy test site
        uses: actions/deploy-pages@v5
