name: Mirror Live Site to Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mirror-live.yml"
      - "scripts/live_mirror_v2.py"
      - "scripts/sitecustomize.py"
      - "tests/**"
  schedule:
    - cron: "0 8 * * *"
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kingdom-circuit-live-mirror
  cancel-in-progress: true

env:
  LIVE_REPO: 84lorinw-a11y/kingdom-circuit
  APPROVED_SEO_REPO: 84lorinw-a11y/kingdom-circuit-test
  APPROVED_SEO_REF: af197d30b8ad4e3cb33e37cfc7a2de086335140d

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v6

      - name: Resolve the currently deployed live revision
        id: live_deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API_PATH="repos/${LIVE_REPO}/actions/workflows/update-and-deploy.yml/runs?branch=main&per_page=20"
          if ! RESPONSE=$(gh api "$API_PATH"); then
            RESPONSE=$(curl -fsSL "https://api.github.com/$API_PATH")
          fi
          LIVE_SHA=$(jq -r \
            '.workflow_runs | map(select(.status == "completed" and .conclusion == "success"))[0].head_sha // empty' \
            <<<"$RESPONSE")
          LIVE_RUN_ID=$(jq -r \
            '.workflow_runs | map(select(.status == "completed" and .conclusion == "success"))[0].id // empty' \
            <<<"$RESPONSE")
          LIVE_CREATED_AT=$(jq -r \
            '.workflow_runs | map(select(.status == "completed" and .conclusion == "success"))[0].created_at // empty' \
            <<<"$RESPONSE")
          test -n "$LIVE_SHA"
          test -n "$LIVE_RUN_ID"
          test -n "$LIVE_CREATED_AT"
          LIVE_CUTOFF=$(TZ=America/Los_Angeles date -d "$LIVE_CREATED_AT" +%F)
          echo "sha=$LIVE_SHA" >> "$GITHUB_OUTPUT"
          echo "run_id=$LIVE_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "cutoff=$LIVE_CUTOFF" >> "$GITHUB_OUTPUT"
          echo "Mirroring successful live deployment $LIVE_RUN_ID at $LIVE_SHA with release date $LIVE_CUTOFF"

      - name: Checkout live repository read-only
        uses: actions/checkout@v6
        with:
          repository: ${{ env.LIVE_REPO }}
          ref: ${{ steps.live_deployment.outputs.sha }}
          path: _live
          fetch-depth: 1

      - name: Checkout the production SEO source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.APPROVED_SEO_REPO }}
          ref: ${{ env.APPROVED_SEO_REF }}
          path: _seo_source
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify mirror harness
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/live_mirror_v2.py
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build the exact production artifact
        shell: bash
        env:
          KC_MIRROR_DATE: ${{ steps.live_deployment.outputs.cutoff }}
          KC_FINALIZE_PUBLIC_EXPERIENCE: "1"
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          set -euo pipefail
          cd _live

          python scripts/sync_verified_artist_registry.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/apply_curated_catalog_policy.py
          python scripts/apply_sep12_live_audit_repairs.py
          python scripts/prune_past_events.py --source . --cutoff "$KC_MIRROR_DATE"
          python scripts/apply_sevin_official_schedule.py
          python scripts/apply_live_artist_overrides.py --source .
          python scripts/apply_deonte_hall_submission.py
          python scripts/apply_sep13_content_repairs.py

          rm -rf _site
          mkdir -p _site/config
          cp index.html styles.css app.js events.json run-status.json \
             supplemental-events.json 404.html robots.txt sitemap.xml _site/
          cp config/artists.json _site/config/artists.json
          cp -R shows festivals new-shows artists event submit assets _site/
          cp CNAME _site/CNAME

          python scripts/build_seo_site.py
          KC_SEO_SOURCE="$GITHUB_WORKSPACE/_seo_source/scripts" \
            python scripts/apply_approved_seo.py _site
          node --check _site/app.js
          node --check _site/seo-enhancements.js
          python scripts/apply_live_artist_overrides.py --site _site
          python scripts/prune_past_events.py --site _site --cutoff "$KC_MIRROR_DATE"
          python scripts/verify_multipage_site.py _site
          python scripts/finalize_live_event_images.py --site _site
          python scripts/finalize_seo_indexing.py --site _site

      - name: Convert only the deployment identity for test
        shell: bash
        run: |
          set -euo pipefail
          LIVE_SHA=$(git -C _live rev-parse HEAD)
          test "$LIVE_SHA" = "${{ steps.live_deployment.outputs.sha }}"
          LIVE_RUN_ID="${{ steps.live_deployment.outputs.run_id }}"
          python scripts/live_mirror_v2.py \
            _live/_site _site "$LIVE_SHA" "$LIVE_RUN_ID"

          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/app.js
          test -s _site/config/artists.json
          test -s _site/seo-static.js
          test -s _site/seo-enhancements.js
          test -s _site/test-live-mirror-manifest.json
          test -f _site/.nojekyll
          test ! -e _site/CNAME
          test ! -e _site/artwork-audit.json
          test ! -e _site/sep12-closeout-report.json
          test ! -e _site/seo-build-manifest.json
          test ! -e _site/seo-indexing-policy.json
          test ! -e _site/seo-overlay-manifest.json
          grep -q 'Disallow: /' _site/robots.txt
          grep -q 'name="robots" content="noindex,nofollow"' _site/index.html
          grep -q '/kingdom-circuit-test/styles.css' _site/index.html
          grep -q '/kingdom-circuit-test/app.js' _site/index.html
          grep -q '"mode": "exact-live-artifact-mirror"' _site/test-live-mirror-manifest.json
          grep -q "\"liveCommit\": \"$LIVE_SHA\"" _site/test-live-mirror-manifest.json
          grep -q "\"liveDeploymentRunId\": \"$LIVE_RUN_ID\"" _site/test-live-mirror-manifest.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: https://84lorinw-a11y.github.io/kingdom-circuit-test/
    steps:
      - name: Deploy test site
        uses: actions/deploy-pages@v5
