name: Kingdom Circuit Live Baseline Mirror

on:
  push:
    branches: [main]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kingdom-circuit-live-baseline-mirror
  cancel-in-progress: true

env:
  LIVE_REPO: 84lorinw-a11y/kingdom-circuit
  TEST_BASE: /kingdom-circuit-test/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test repository
        uses: actions/checkout@v6

      - name: Checkout current live-site source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.LIVE_REPO }}
          ref: main
          path: _live
          fetch-depth: 1

      - name: Capture source revisions
        id: revisions
        shell: bash
        run: |
          set -euo pipefail
          LIVE_SHA=$(git -C _live rev-parse HEAD)
          TEST_SHA=$(git rev-parse HEAD)
          CACHE_TOKEN="${LIVE_SHA:0:12}-${TEST_SHA:0:12}"
          echo "live_sha=$LIVE_SHA" >> "$GITHUB_OUTPUT"
          echo "test_sha=$TEST_SHA" >> "$GITHUB_OUTPUT"
          echo "cache_token=$CACHE_TOKEN" >> "$GITHUB_OUTPUT"
          echo "Mirroring live $LIVE_SHA from ${LIVE_REPO}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify live source before mirroring
        shell: bash
        run: |
          set -euo pipefail
          cd _live
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s events.json
          test -s run-status.json
          test -s supplemental-events.json
          test -s config/artists.json
          test -s scripts/build_seo_site.py
          test -s scripts/verify_multipage_site.py
          test -s artists/index.html
          test -s artists/profile/index.html
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build the same production artifact as live
        shell: bash
        run: |
          set -euo pipefail
          cd _live
          rm -rf _site
          mkdir -p _site/config

          cp index.html styles.css app.js events.json run-status.json \
             supplemental-events.json 404.html robots.txt sitemap.xml _site/
          cp config/artists.json _site/config/artists.json
          cp -R shows festivals new-shows artists event submit assets _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi

          python scripts/build_seo_site.py
          python scripts/verify_multipage_site.py _site

      - name: Convert live artifact for safe test hosting
        shell: bash
        env:
          LIVE_SHA: ${{ steps.revisions.outputs.live_sha }}
          CACHE_TOKEN: ${{ steps.revisions.outputs.cache_token }}
        run: |
          set -euo pipefail
          python -m py_compile scripts/mirror_live_baseline.py
          rm -rf _baseline _prod_reference
          python scripts/mirror_live_baseline.py \
            _live/_site _prod_reference _baseline "$LIVE_SHA" "$CACHE_TOKEN"

      - name: Verify source, data, style and cache parity
        shell: bash
        env:
          LIVE_SHA: ${{ steps.revisions.outputs.live_sha }}
          CACHE_TOKEN: ${{ steps.revisions.outputs.cache_token }}
        run: |
          set -euo pipefail
          cmp _live/_site/styles.css _baseline/styles.css
          cmp _live/_site/events.json _baseline/events.json
          cmp _live/_site/config/artists.json _baseline/config/artists.json
          cmp _live/_site/supplemental-events.json _baseline/supplemental-events.json
          cmp _live/_site/assets/logo.png _baseline/assets/logo.png

          test ! -e _baseline/CNAME
          grep -q '"mode": "live-baseline-mirror"' _baseline/test-live-mirror-manifest.json
          grep -q 'Disallow: /' _baseline/robots.txt
          grep -q "kc_mirror=${CACHE_TOKEN}" _baseline/artists/index.html

          python - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path('_baseline/test-live-mirror-manifest.json').read_text())
          assert m['productionMarkupParity'] is True, m
          assert m['assetsByteIdentical'] is True, m
          assert m['testNoindex'] is True, m
          assert m['liveCommit'] == os.environ['LIVE_SHA'], m
          assert m['cacheToken'] == os.environ['CACHE_TOKEN'], m
          print('Live baseline mirror verified:', m)
          PY

      - name: Install browser test dependency
        run: python -m pip install --quiet selenium

      - name: Runtime browser parity against production build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kc-test-host
          mkdir -p /tmp/kc-test-host/kingdom-circuit-test
          cp -a _baseline/. /tmp/kc-test-host/kingdom-circuit-test/

          python3 -m http.server 8764 --directory _prod_reference >/tmp/kc-prod-http.log 2>&1 &
          PROD_PID=$!
          python3 -m http.server 8765 --directory /tmp/kc-test-host >/tmp/kc-test-http.log 2>&1 &
          TEST_PID=$!
          trap 'kill "$PROD_PID" "$TEST_PID" 2>/dev/null || true' EXIT
          sleep 1

          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          import re
          import time

          PROD='http://127.0.0.1:8764/'
          TEST='http://127.0.0.1:8765/kingdom-circuit-test/'

          options=webdriver.ChromeOptions()
          options.add_argument('--headless=new')
          options.add_argument('--no-sandbox')
          options.add_argument('--disable-dev-shm-usage')
          options.add_argument('--window-size=1440,1000')
          driver=webdriver.Chrome(options=options)

          def normalize_url(value):
              value=str(value or '')
              value=value.replace(TEST, PROD)
              value=value.replace('/kingdom-circuit-test/', '/')
              value=re.sub(r'([?&])kc_mirror=[A-Za-z0-9._-]+', '', value)
              return value

          def directory_snapshot(base):
              driver.get(base+'artists/')
              WebDriverWait(driver,25).until(
                  lambda d: len(d.find_elements(By.CSS_SELECTOR,'[data-artist-card]')) >= 250
                  and len(d.find_elements(By.CSS_SELECTOR,'.artist-card-links')) >= 250
              )
              cards=driver.find_elements(By.CSS_SELECTOR,'[data-artist-card]')
              names=[e.text.strip() for e in driver.find_elements(By.CSS_SELECTOR,'[data-artist-card] h2')]
              images=driver.find_elements(By.CSS_SELECTOR,'[data-artist-card] .artist-visual img')
              social=driver.find_elements(By.CSS_SELECTOR,'[data-artist-social]')
              icons=driver.find_elements(By.CSS_SELECTOR,'.artist-platform-link svg.platform-icon')
              assert len(cards) >= 250
              assert len(images) >= 40, len(images)
              assert len(social) >= 80, len(social)
              assert len(icons) >= 80, len(icons)
              assert all(i.size['width'] > 0 and i.size['height'] > 0 for i in icons[:20])

              menu=driver.find_element(By.CSS_SELECTOR,'.menu-toggle')
              menu.click(); time.sleep(.15)
              assert 'open' in driver.find_element(By.CSS_SELECTOR,'.menu-drawer').get_attribute('class')

              return {
                  'count': len(cards),
                  'names': names,
                  'images': [normalize_url(i.get_attribute('src')) for i in images],
                  'social_labels': [s.get_attribute('data-artist-social') for s in social],
                  'social_hrefs': [normalize_url(s.get_attribute('href')) for s in social],
                  'icon_count': len(icons),
              }

          def artist_page_snapshot(base):
              driver.get(base+'artists/lecrae/')
              WebDriverWait(driver,25).until(lambda d: d.find_elements(By.CSS_SELECTOR,'h1'))
              heading=driver.find_element(By.CSS_SELECTOR,'h1').text.strip()
              events=driver.find_elements(By.CSS_SELECTOR,'[data-event-card]')
              assert heading
              return {'heading': heading, 'events': len(events)}

          try:
              prod_dir=directory_snapshot(PROD)
              test_dir=directory_snapshot(TEST)
              assert test_dir == prod_dir, (prod_dir, test_dir)

              prod_artist=artist_page_snapshot(PROD)
              test_artist=artist_page_snapshot(TEST)
              assert test_artist == prod_artist, (prod_artist, test_artist)
          finally:
              driver.quit()

          print('Runtime production/test parity passed: directory, artist images, social icons/links, artist page, menu')
          PY

          kill "$PROD_PID" "$TEST_PID"
          trap - EXIT

      - name: Prepare deployable test site and apply optional test overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          cp -a _baseline _site

          if [ -d test-overlay ]; then
            echo "Applying test-overlay/ on top of current live baseline"
            cp -a test-overlay/. _site/
          fi

          if [ -f scripts/apply_test_overlay.py ]; then
            echo "Applying scripted test overlay"
            python scripts/apply_test_overlay.py _site
          fi

          test ! -e _site/CNAME
          grep -q 'Disallow: /' _site/robots.txt
          node --check _site/app.js

          python - <<'PY'
          from pathlib import Path
          live_ga='G-N2KK9XF4TJ'
          failures=[]
          for p in Path('_site').rglob('*.html'):
              text=p.read_text(encoding='utf-8')
              if 'name="robots" content="noindex,nofollow"' not in text:
                  failures.append(f'missing-noindex:{p}')
              if live_ga in text:
                  failures.append(f'live-ga:{p}')
          if failures:
              raise SystemExit('\n'.join(failures[:50]))
          print('Deployable test-site safety checks passed')
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload mirrored live-site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: https://84lorinw-a11y.github.io/kingdom-circuit-test/
    steps:
      - name: Deploy current live baseline to test
        id: deployment
        uses: actions/deploy-pages@v4
