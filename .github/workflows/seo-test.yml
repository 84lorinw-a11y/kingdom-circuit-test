name: Kingdom Circuit Live Baseline Mirror

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kingdom-circuit-live-baseline-mirror
  cancel-in-progress: true

env:
  LIVE_REPO: 84lorinw-a11y/kingdom-circuit
  LIVE_COMMIT: 88fab267531e2b5061bad679b2ab1b401511a8bc
  TEST_BASE: /kingdom-circuit-test/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test repository
        uses: actions/checkout@v6

      - name: Checkout exact live-site snapshot
        uses: actions/checkout@v6
        with:
          repository: ${{ env.LIVE_REPO }}
          ref: ${{ env.LIVE_COMMIT }}
          path: _live
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify live snapshot before mirroring
        shell: bash
        run: |
          set -euo pipefail
          cd _live
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s events.json
          test -s run-status.json
          test -s supplemental-events.json
          test -s config/artists.json
          test -s scripts/build_seo_site.py
          test -s scripts/verify_multipage_site.py
          test -s artists/index.html
          test -s artists/profile/index.html
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Build the same production artifact as live
        shell: bash
        run: |
          set -euo pipefail
          cd _live
          rm -rf _site
          mkdir -p _site/config

          cp index.html styles.css app.js events.json run-status.json \
             supplemental-events.json 404.html robots.txt sitemap.xml _site/
          cp config/artists.json _site/config/artists.json
          cp -R shows festivals new-shows artists event submit assets _site/
          if [ -f CNAME ]; then cp CNAME _site/; fi

          python scripts/build_seo_site.py
          python scripts/verify_multipage_site.py _site

      - name: Convert exact live artifact for safe test hosting
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/mirror_live_baseline.py
          python scripts/mirror_live_baseline.py _live/_site _prod_reference _site

      - name: Verify source/data/style parity
        shell: bash
        run: |
          set -euo pipefail
          cmp _live/_site/styles.css _site/styles.css
          cmp _live/_site/events.json _site/events.json
          cmp _live/_site/config/artists.json _site/config/artists.json
          cmp _live/_site/supplemental-events.json _site/supplemental-events.json
          cmp _live/_site/assets/logo.png _site/assets/logo.png

          test ! -e _site/CNAME
          test ! -e _site/seo-phase2.css
          test ! -e _site/seo-phase2.js
          grep -q '"mode": "live-baseline-mirror"' _site/test-live-mirror-manifest.json
          grep -q 'Disallow: /' _site/robots.txt

          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('_site/test-live-mirror-manifest.json').read_text())
          assert m['productionMarkupParity'] is True, m
          assert m['assetsByteIdentical'] is True, m
          assert m['testNoindex'] is True, m
          assert m['liveCommit'] == '88fab267531e2b5061bad679b2ab1b401511a8bc', m
          print('Live baseline mirror verified:', m)
          PY

      - name: Install browser test dependency
        run: python -m pip install --quiet selenium

      - name: Browser smoke-test mirrored live experience
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kc-live-mirror
          mkdir -p /tmp/kc-live-mirror/kingdom-circuit-test
          cp -a _site/. /tmp/kc-live-mirror/kingdom-circuit-test/
          python3 -m http.server 8765 --directory /tmp/kc-live-mirror >/tmp/kc-live-mirror-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1

          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          import time

          BASE='http://127.0.0.1:8765/kingdom-circuit-test/'
          o=webdriver.ChromeOptions()
          o.add_argument('--headless=new')
          o.add_argument('--no-sandbox')
          o.add_argument('--disable-dev-shm-usage')
          o.add_argument('--window-size=1440,1000')
          d=webdriver.Chrome(options=o)
          try:
              d.get(BASE)
              WebDriverWait(d,20).until(lambda x: len(x.find_elements(By.CSS_SELECTOR,'[data-event-card]')) >= 20)
              logo=d.find_element(By.CSS_SELECTOR,'.brand img')
              assert d.execute_script('return arguments[0].naturalWidth', logo) > 0
              d.find_element(By.CSS_SELECTOR,'.menu-toggle').click(); time.sleep(.2)
              assert 'open' in d.find_element(By.CSS_SELECTOR,'.menu-drawer').get_attribute('class')

              d.get(BASE+'artists/')
              WebDriverWait(d,20).until(lambda x: len(x.find_elements(By.CSS_SELECTOR,'[data-artist-card]')) >= 250)
              cards=d.find_elements(By.CSS_SELECTOR,'[data-artist-card]')
              assert len(cards) >= 250
              image_cards=[c for c in cards if c.find_elements(By.CSS_SELECTOR,'img')]
              assert len(image_cards) >= 40, len(image_cards)

              d.get(BASE+'artists/profile/?name=Lecrae')
              WebDriverWait(d,20).until(lambda x: not x.find_elements(By.CSS_SELECTOR,'.loading-panel'))
              assert 'Lecrae' in d.page_source
              assert 'instagram.com/lecrae' in d.page_source
              assert 'open.spotify.com/artist/1CFCsEqKrCyvAFKOATQHiW' in d.page_source
              social_links=d.find_elements(By.CSS_SELECTOR,'[data-artist-social]')
              assert len(social_links) >= 4, len(social_links)
              assert len(d.find_elements(By.CSS_SELECTOR,'.profile-platform-icon')) >= 4
              profile_images=d.find_elements(By.CSS_SELECTOR,'.profile-visual img')
              assert profile_images
              assert 'open.voidware.de/artist/1CFCsEqKrCyvAFKOATQHiW' in profile_images[0].get_attribute('src')
          finally:
              d.quit()
          print('Mirrored live browser experience passed')
          PY

          kill "$SERVER_PID"
          trap - EXIT

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload mirrored live-site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: https://84lorinw-a11y.github.io/kingdom-circuit-test/
    steps:
      - name: Deploy exact live baseline to test
        id: deployment
        uses: actions/deploy-pages@v4
