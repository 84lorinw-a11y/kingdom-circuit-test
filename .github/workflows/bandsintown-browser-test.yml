name: Bandsintown browser diagnostic

on:
  push:
    branches: [bandsintown-browser-test]
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: true

jobs:
  browser-test:
    if: ${{ !contains(github.event.head_commit.message, '[skip browser test]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test Bandsintown with real browser engine
        run: node scripts/test_bandsintown_playwright.mjs

      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandsintown-browser-test-results
          path: bandsintown-browser-test-results.json
          if-no-files-found: warn

      - name: Save diagnostic results to branch
        if: always()
        shell: bash
        run: |
          if [ ! -f bandsintown-browser-test-results.json ]; then
            exit 0
          fi
          git config user.name "kingdom-circuit-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bandsintown-browser-test-results.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "test: save Bandsintown browser results [skip browser test]"
          git push origin HEAD:bandsintown-browser-test
