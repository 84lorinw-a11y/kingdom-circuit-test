name: Kingdom Circuit SEO Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kingdom-circuit-seo-test-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build SEO test artifact
        shell: bash
        run: |
          cat > /tmp/build_kc_seo.py <<'PY'
          from __future__ import annotations
          
          import datetime as dt
          import hashlib
          import html
          import json
          import os
          import pathlib
          import re
          import shutil
          import sys
          import urllib.request
          from collections import defaultdict
          from urllib.parse import urlparse
          
          REPO = pathlib.Path.cwd()
          OUT = REPO / "_site"
          BASE_PATH = "/kingdom-circuit-test/"
          SITE_ORIGIN = "https://84lorinw-a11y.github.io"
          LIVE_SITE = "https://kingdomcircuit.com"
          TEST_MODE = True
          LIVE_EVENTS = "https://raw.githubusercontent.com/84lorinw-a11y/kingdom-circuit/main/events.json"
          LIVE_ARTISTS = "https://raw.githubusercontent.com/84lorinw-a11y/kingdom-circuit/main/config/artists.json"
          TODAY = dt.date.today()
          
          STATE_NAMES = {
              "AL":"Alabama","AK":"Alaska","AZ":"Arizona","AR":"Arkansas","CA":"California","CO":"Colorado","CT":"Connecticut","DE":"Delaware","DC":"District of Columbia","FL":"Florida","GA":"Georgia","HI":"Hawaii","ID":"Idaho","IL":"Illinois","IN":"Indiana","IA":"Iowa","KS":"Kansas","KY":"Kentucky","LA":"Louisiana","ME":"Maine","MD":"Maryland","MA":"Massachusetts","MI":"Michigan","MN":"Minnesota","MS":"Mississippi","MO":"Missouri","MT":"Montana","NE":"Nebraska","NV":"Nevada","NH":"New Hampshire","NJ":"New Jersey","NM":"New Mexico","NY":"New York","NC":"North Carolina","ND":"North Dakota","OH":"Ohio","OK":"Oklahoma","OR":"Oregon","PA":"Pennsylvania","RI":"Rhode Island","SC":"South Carolina","SD":"South Dakota","TN":"Tennessee","TX":"Texas","UT":"Utah","VT":"Vermont","VA":"Virginia","WA":"Washington","WV":"West Virginia","WI":"Wisconsin","WY":"Wyoming"
          }
          
          ARTIST_OVERRIDES = {
              "kb": {"spotifyProfile": "https://open.spotify.com/artist/77IKXFvO7SpWrq8hflrUXc"},
              "skema boy": {
                  "imageUrl": "assets/artists/skema-boy-v6.webp",
                  "instagramProfile": "https://www.instagram.com/skema.boy/",
                  "spotifyProfile": "https://open.spotify.com/artist/1KTljUXZGt7HkAFFEnDBn1",
                  "youtubeProfile": "https://www.youtube.com/@skemaboy",
                  "officialProfile": "https://rixonentertainment.com/skema-boy",
              },
          }
          
          
          def esc(value) -> str:
              return html.escape(str(value or ""), quote=True)
          
          
          def normalize(value) -> str:
              return str(value or "").strip().casefold()
          
          
          def slugify(value: str) -> str:
              value = str(value or "").strip().casefold()
              value = value.replace("&", " and ")
              value = re.sub(r"[^a-z0-9]+", "-", value)
              return value.strip("-") or "item"
          
          
          def fnv1a_32(value: str) -> str:
              h = 0x811C9DC5
              for b in str(value).encode("utf-8"):
                  h ^= b
                  h = (h * 0x01000193) & 0xFFFFFFFF
              return f"{h:08x}"[:6]
          
          
          def event_slug(event: dict) -> str:
              core = "-".join(filter(None, [slugify(event.get("title", "event")), event.get("startDate", ""), slugify(event.get("city", ""))]))
              return f"{core}-{fnv1a_32(event.get('id') or json.dumps(event, sort_keys=True))}"
          
          
          def artist_slug(name: str) -> str:
              return slugify(name)
          
          
          def state_slug(code: str) -> str:
              return slugify(STATE_NAMES.get(code, code))
          
          
          def city_slug(city: str, state: str) -> str:
              return f"{slugify(city)}-{state_slug(state)}"
          
          
          def month_slug(date_string: str) -> str:
              d = dt.date.fromisoformat(date_string[:10])
              return f"{d.strftime('%B').lower()}-{d.year}"
          
          
          def absolute_url(path: str) -> str:
              if path.startswith("http://") or path.startswith("https://"):
                  return path.replace("http://", "https://", 1)
              return SITE_ORIGIN.rstrip("/") + "/" + path.lstrip("/")
          
          
          def asset_url(value: str | None) -> str:
              if not value:
                  return absolute_url(BASE_PATH + "assets/event-fallback.webp")
              if str(value).startswith("http://") or str(value).startswith("https://"):
                  return str(value).replace("http://", "https://", 1)
              return absolute_url(BASE_PATH + str(value).lstrip("/"))
          
          
          def fetch_json(url: str, fallback: pathlib.Path) -> list:
              if os.environ.get("SEO_OFFLINE") == "1":
                  return json.loads(fallback.read_text(encoding="utf-8"))
              req = urllib.request.Request(url, headers={"User-Agent": "KingdomCircuit-SEO-Test/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return json.load(response)
              except Exception as exc:
                  print(f"WARNING: fetch failed for {url}: {exc}; using {fallback}")
                  return json.loads(fallback.read_text(encoding="utf-8"))
          
          
          def apply_artist_overrides(artists: list[dict]) -> list[dict]:
              result = []
              for artist in artists:
                  merged = dict(artist)
                  merged.update(ARTIST_OVERRIDES.get(normalize(artist.get("name")), {}))
                  result.append(merged)
              return result
          
          
          def event_artist_set(event: dict) -> set[str]:
              return {normalize(x) for x in event.get("artists", []) if x}
          
          
          def same_event(a: dict, b: dict) -> bool:
              if not a or not b or a.get("startDate") != b.get("startDate"):
                  return False
              if normalize(a.get("city")) != normalize(b.get("city")):
                  return False
              same_venue = bool(normalize(a.get("venue"))) and normalize(a.get("venue")) == normalize(b.get("venue"))
              shared = bool(event_artist_set(a) & event_artist_set(b))
              return same_venue or shared
          
          
          def merge_event_lists(primary: list[dict], supplemental: list[dict]) -> list[dict]:
              # Match the site's merge semantics: preserve primary data and enrich it from supplemental.
              merged = [dict(event, artists=list(event.get("artists", []))) for event in primary]
              for incoming in supplemental:
                  existing = next((event for event in merged if same_event(event, incoming)), None)
                  if not existing:
                      merged.append(dict(incoming, artists=list(incoming.get("artists", []))))
                      continue
                  existing["artists"] = list(dict.fromkeys([*existing.get("artists", []), *incoming.get("artists", [])]))
                  for field in ("image", "imageType", "imagePosition", "firstSeen"):
                      if not existing.get(field) and incoming.get(field):
                          existing[field] = incoming[field]
              return merged
          
          
          def is_current_event(event: dict) -> bool:
              end = event.get("endDate") or event.get("startDate")
              try:
                  return dt.date.fromisoformat(str(end)[:10]) >= TODAY
              except Exception:
                  return True
          
          
          def format_date(event: dict) -> str:
              raw = event.get("startDate")
              if not raw:
                  return "Date to be announced"
              try:
                  d = dt.date.fromisoformat(raw[:10])
                  text = d.strftime("%a, %b %-d, %Y")
              except Exception:
                  text = raw
              if event.get("startTime"):
                  try:
                      h, m = [int(x) for x in event["startTime"].split(":")[:2]]
                      suffix = "AM" if h < 12 else "PM"
                      h12 = h % 12 or 12
                      text += f" - {h12}:{m:02d} {suffix}"
                  except Exception:
                      pass
              return text
          
          
          def source_text(event: dict) -> str:
              if event.get("sourceName"):
                  return event["sourceName"]
              sources = event.get("sources") or []
              return sources[0].get("name", "Official source") if sources else "Official source"
          
          
          def artist_config(artists: list[dict], name: str) -> dict | None:
              target = normalize(name)
              for artist in artists:
                  if normalize(artist.get("name")) == target or any(normalize(a) == target for a in artist.get("aliases", [])):
                      return artist
              return None
          
          
          def spotify_url(artist: dict) -> str:
              if artist.get("spotifyProfile"):
                  return artist["spotifyProfile"]
              if artist.get("spotifyId"):
                  return f"https://open.spotify.com/artist/{artist['spotifyId']}"
              return ""
          
          
          def instagram_url(artist: dict) -> str:
              return artist.get("instagramProfile", "")
          
          
          def youtube_url(artist: dict) -> str:
              if artist.get("youtubeProfile"):
                  return artist["youtubeProfile"]
              official = artist.get("officialProfile", "")
              return official if re.search(r"youtu\.be|youtube\.com", official, re.I) else ""
          
          
          def website_url(artist: dict) -> str:
              candidate = artist.get("website") or artist.get("officialWebsite") or artist.get("officialProfile") or ""
              if re.search(r"instagram\.com|open\.spotify\.com|youtu\.be|youtube\.com|music\.apple\.com|bandsintown\.com", candidate, re.I):
                  return ""
              return candidate
          
          
          def platform_card(label: str, url: str, pending: str) -> str:
              if url:
                  return f'<a class="profile-platform-card" href="{esc(url)}" target="_blank" rel="noopener"><span class="profile-platform-label">{esc(label)}</span><span class="profile-platform-status">Open verified {esc(label)} profile</span></a>'
              return f'<div class="profile-platform-card is-missing"><span class="profile-platform-label">{esc(label)}</span><span class="profile-platform-status">{esc(pending)}</span></div>'
          
          
          def compact_platform_link(label: str, url: str) -> str:
              if url:
                  return f'<a class="artist-platform-link" href="{esc(url)}" target="_blank" rel="noopener">{esc(label)}</a>'
              return f'<span class="artist-platform-link is-missing" title="{esc(label)} link pending verification">{esc(label)}</span>'
          
          
          def event_detail_path(event: dict) -> str:
              return f"{BASE_PATH}event/{event_slug(event)}/"
          
          
          def artist_detail_path(name: str) -> str:
              return f"{BASE_PATH}artists/{artist_slug(name)}/"
          
          
          def event_card(event: dict, artists: list[dict]) -> str:
              config = artist_config(artists, event.get("headliner") or (event.get("artists") or [""])[0]) or {}
              image = asset_url(event.get("image") or config.get("imageUrl"))
              image_class = "event-artwork" if event.get("imageType") == "event_artwork" else "artist-photo"
              position = event.get("imagePosition") or config.get("imagePosition") or "center"
              location = ", ".join(x for x in (event.get("city"), event.get("state")) if x) or "Location to be announced"
              recent = ""
              if event.get("firstSeen"):
                  try:
                      seen = dt.datetime.fromisoformat(event["firstSeen"].replace("Z", "+00:00")).date()
                      if seen >= TODAY - dt.timedelta(days=14):
                          recent = '<span class="badge">New to Kingdom Circuit</span>'
                  except Exception:
                      pass
              price = f'<p class="price-line">Listed price: {esc(event.get("price"))}</p>' if event.get("price") else ""
              artist_links = " - ".join(f'<a href="{artist_detail_path(name)}">{esc(name)}</a>' for name in event.get("artists", []))
              official = event.get("officialUrl") or event.get("ticketUrl") or "#"
              return f'''<article class="event-card" data-event-card data-state="{esc(event.get('state'))}" data-type="{esc(event.get('eventType') or 'concert')}" data-date="{esc(event.get('startDate'))}" data-end-date="{esc(event.get('endDate') or event.get('startDate'))}">
            <a class="event-media" href="{event_detail_path(event)}" aria-label="View {esc(event.get('title'))}"><img class="{image_class}" src="{esc(image)}" alt="{esc(event.get('title'))} image" loading="lazy" decoding="async" width="1200" height="675" style="object-position:{esc(position)}"></a>
            <div class="event-content"><div class="event-main"><div class="event-badges"><span class="badge badge-gold">{esc('Festival' if event.get('eventType') == 'festival' else 'Concert')}</span>{recent}</div><h3><a href="{event_detail_path(event)}">{esc(event.get('title'))}</a></h3><p class="artist-line">{artist_links}</p><dl class="event-meta"><div><dt>Date</dt><dd>{esc(format_date(event))}</dd></div><div><dt>Venue</dt><dd>{esc(event.get('venue') or 'Venue to be announced')}</dd></div><div><dt>Location</dt><dd>{esc(location)}</dd></div></dl>{price}</div><div class="event-footer"><a class="official-button" href="{esc(official)}" target="_blank" rel="noopener">Official details</a><p class="source-line">Source: {esc(source_text(event))}</p></div></div>
          </article>'''
          
          
          def header(current: str = "") -> str:
              items = [
                  ("Home", BASE_PATH, "home"),
                  ("All Shows", BASE_PATH + "shows/", "shows"),
                  ("This Month", BASE_PATH + "shows/this-month/", "month"),
                  ("Festivals", BASE_PATH + "festivals/", "festivals"),
                  ("New Shows", BASE_PATH + "new-shows/", "new"),
                  ("Artists", BASE_PATH + "artists/", "artists"),
                  ("Submit a Show", BASE_PATH + "submit/", "submit"),
              ]
              links = "".join(f'<a href="{href}"{" aria-current=\"page\"" if key == current else ""}>{label}</a>' for label, href, key in items)
              return f'''<div class="test-site-banner">TEST SITE - SEO architecture preview. <a href="{LIVE_SITE}">Open the live site</a></div>
          <header class="site-header"><div class="header-inner"><a class="brand" href="{BASE_PATH}" aria-label="The Kingdom Circuit home"><img src="{BASE_PATH}assets/logo.png" alt="The Kingdom Circuit - Christian hip-hop, live and connected" decoding="async"></a><button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu" aria-label="Open navigation"><span></span><span></span><span></span></button></div></header>
          <div class="menu-backdrop" hidden></div>
          <nav class="menu-drawer" id="site-menu" aria-label="Primary navigation" aria-hidden="true"><div class="menu-drawer-head"><span>Explore Kingdom Circuit</span><button class="menu-close" type="button" aria-label="Close navigation">x</button></div><div class="menu-links">{links}</div><p class="menu-mission">Christian hip-hop, live and connected.</p></nav>'''
          
          
          def footer() -> str:
              return f'''<footer class="site-footer"><div><strong>The Kingdom Circuit</strong><p>Christian hip-hop, live and connected.</p></div><div class="footer-links"><a href="{BASE_PATH}shows/">All Shows</a><a href="{BASE_PATH}artists/">Artists</a><a href="{BASE_PATH}festivals/">Festivals</a><a href="{BASE_PATH}submit/">Submit a Show</a></div><p class="footer-note">Test site data is loaded from the live Kingdom Circuit repository. Event details may change; confirm with the official source before traveling.</p></footer>'''
          
          
          def head(title: str, description: str, canonical_path: str, jsonld: list[dict] | dict | None = None) -> str:
              canonical = absolute_url(canonical_path)
              schemas = []
              if jsonld:
                  schemas = jsonld if isinstance(jsonld, list) else [jsonld]
              schema_html = "\n".join(f'<script type="application/ld+json">{json.dumps(s, ensure_ascii=False, separators=(",", ":")).replace("</", "<\\/")}</script>' for s in schemas)
              robots = "noindex,nofollow" if TEST_MODE else "index,follow"
              return f'''<head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <meta name="robots" content="{robots}">
          <meta name="description" content="{esc(description)}">
          <meta name="theme-color" content="#080808">
          <link rel="canonical" href="{esc(canonical)}">
          <link rel="icon" href="{BASE_PATH}assets/favicon.svg" type="image/svg+xml">
          <link rel="stylesheet" href="{BASE_PATH}styles.css">
          <link rel="stylesheet" href="{BASE_PATH}patch-v6.css?v=seo1">
          <meta property="og:type" content="website">
          <meta property="og:title" content="{esc(title)}">
          <meta property="og:description" content="{esc(description)}">
          <meta property="og:url" content="{esc(canonical)}">
          <meta name="twitter:card" content="summary_large_image">
          <script src="{BASE_PATH}seo-static.js?v=1" defer></script>
          <title>{esc(title)}</title>
          {schema_html}
          </head>'''
          
          
          def breadcrumb_schema(items: list[tuple[str, str]]) -> dict:
              return {
                  "@context": "https://schema.org",
                  "@type": "BreadcrumbList",
                  "itemListElement": [
                      {"@type": "ListItem", "position": i + 1, "name": name, "item": absolute_url(path)}
                      for i, (name, path) in enumerate(items)
                  ],
              }
          
          
          def breadcrumb_html(items: list[tuple[str, str]]) -> str:
              rendered = []
              for i, (name, path) in enumerate(items):
                  if i == len(items) - 1:
                      rendered.append(esc(name))
                  else:
                      rendered.append(f'<a class="text-link" href="{path}">{esc(name)}</a>')
              return '<p class="eyebrow">' + " / ".join(rendered) + "</p>"
          
          
          def page(title: str, description: str, canonical_path: str, body: str, current: str = "", jsonld=None) -> str:
              return f'''<!DOCTYPE html>
          <html lang="en">
          {head(title, description, canonical_path, jsonld)}
          <body>
          {header(current)}
          <main>{body}</main>
          {footer()}
          </body>
          </html>
          '''
          
          
          def fs_relative(relative: str) -> str:
              rel = relative
              if rel.startswith(BASE_PATH):
                  rel = rel[len(BASE_PATH):]
              return rel.strip("/")
          
          
          def write_page(relative: str, content: str) -> None:
              rel = fs_relative(relative)
              target = OUT / rel / "index.html" if rel else OUT / "index.html"
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")
          
          
          def event_jsonld(event: dict) -> dict:
              location = {
                  "@type": "Place",
                  "name": event.get("venue") or "Venue to be announced",
                  "address": {
                      "@type": "PostalAddress",
                      "streetAddress": event.get("address") or "",
                      "addressLocality": event.get("city") or "",
                      "addressRegion": event.get("state") or "",
                      "addressCountry": "US",
                  },
              }
              start = event.get("startDate", "")
              if event.get("startTime"):
                  start += "T" + event["startTime"]
              data = {
                  "@context": "https://schema.org",
                  "@type": "MusicEvent",
                  "name": event.get("title") or "Christian hip-hop event",
                  "startDate": start,
                  "location": location,
                  "eventAttendanceMode": "https://schema.org/OfflineEventAttendanceMode",
                  "eventStatus": "https://schema.org/EventScheduled",
                  "url": absolute_url(event_detail_path(event)),
                  "image": [asset_url(event.get("image"))],
                  "description": f"{event.get('title','Christian hip-hop event')} in {event.get('city','')}, {event.get('state','')}. Verified by The Kingdom Circuit.",
                  "performer": [{"@type": "MusicGroup", "name": name} for name in event.get("artists", [])],
              }
              if event.get("endDate"):
                  data["endDate"] = event["endDate"]
              price = str(event.get("price") or "").strip()
              official = event.get("officialUrl") or event.get("ticketUrl")
              if official and price:
                  offer = {"@type": "Offer", "url": official, "availability": "https://schema.org/InStock"}
                  if price.casefold() == "free":
                      offer.update({"price": 0, "priceCurrency": "USD"})
                  elif re.fullmatch(r"\$?\d+(?:\.\d{1,2})?", price):
                      offer.update({"price": price.lstrip("$"), "priceCurrency": "USD"})
                  data["offers"] = offer
              return data
          
          
          def generate_event_pages(events: list[dict], artists: list[dict]) -> list[str]:
              urls = []
              by_state: dict[str, list[dict]] = defaultdict(list)
              for event in events:
                  if event.get("state"):
                      by_state[event["state"]].append(event)
              for event in events:
                  epath = event_detail_path(event)
                  urls.append(epath)
                  state_name = STATE_NAMES.get(event.get("state", ""), event.get("state", ""))
                  artist_names = ", ".join(event.get("artists", [])) or event.get("headliner") or "CHH artists"
                  location = ", ".join(x for x in (event.get("city"), event.get("state")) if x)
                  title = f"{event.get('title')} - {location} | The Kingdom Circuit"
                  description = f"{artist_names} live in {location} on {format_date(event)}. Venue: {event.get('venue') or 'TBA'}. Official show details and verified source."
                  img = asset_url(event.get("image"))
                  image_class = "event-artwork" if event.get("imageType") == "event_artwork" else "artist-photo"
                  artist_links = " - ".join(f'<a href="{artist_detail_path(name)}">{esc(name)}</a>' for name in event.get("artists", []))
                  state_path = BASE_PATH + "shows/" + state_slug(event.get("state", "")) + "/" if event.get("state") else BASE_PATH + "shows/"
                  crumbs = [("Shows", BASE_PATH + "shows/")]
                  if state_name:
                      crumbs.append((state_name, state_path))
                  crumbs.append((event.get("title") or "Event", epath))
                  nearby = [e for e in by_state.get(event.get("state", ""), []) if e.get("id") != event.get("id")][:3]
                  related = ""
                  if nearby:
                      related = f'''<section class="calendar"><div class="calendar-heading"><div><p class="eyebrow">Keep exploring</p><h2>Other nearby CHH shows</h2></div></div><div class="event-grid">{''.join(event_card(x, artists) for x in nearby)}</div></section>'''
                  body = f'''<section class="event-detail-section">{breadcrumb_html(crumbs)}<article class="event-detail"><div class="event-detail-media"><img class="{image_class}" src="{esc(img)}" alt="{esc(event.get('title'))}" decoding="async" width="1200" height="675" style="object-position:{esc(event.get('imagePosition') or 'center')}"></div><div class="event-detail-copy"><p class="eyebrow">{esc('Festival' if event.get('eventType') == 'festival' else 'Concert')}</p><h1>{esc(event.get('title'))}</h1><p class="artist-line">{artist_links}</p><dl class="detail-list"><div><dt>Date</dt><dd>{esc(format_date(event))}</dd></div><div><dt>Venue</dt><dd>{esc(event.get('venue') or 'Venue to be announced')}</dd></div><div><dt>Location</dt><dd>{esc(location or 'Location to be announced')}</dd></div>{f'<div><dt>Price</dt><dd>{esc(event.get("price"))}</dd></div>' if event.get('price') else ''}<div><dt>Source</dt><dd>{esc(source_text(event))}</dd></div></dl><a class="primary-button" href="{esc(event.get('officialUrl') or event.get('ticketUrl') or '#')}" target="_blank" rel="noopener">Official details</a><p class="disclaimer">Event details, availability, pricing, and lineups may change. Confirm final information with the official organizer or ticket provider before purchasing or traveling.</p></div></article></section>{related}'''
                  schemas = [event_jsonld(event), breadcrumb_schema(crumbs)]
                  write_page(epath, page(title, description, epath, body, current="shows", jsonld=schemas))
              return urls
          
          
          def generate_artist_pages(events: list[dict], artists: list[dict]) -> list[str]:
              urls = []
              slugs = {}
              for artist in artists:
                  if artist.get("enabled") is False:
                      continue
                  slug = artist_slug(artist.get("name", ""))
                  if slug in slugs and normalize(slugs[slug]) != normalize(artist.get("name")):
                      raise RuntimeError(f"Artist slug collision: {slugs[slug]} / {artist.get('name')} -> {slug}")
                  slugs[slug] = artist.get("name")
              for artist in sorted((a for a in artists if a.get("enabled") is not False), key=lambda a: (a.get("rosterOrder", 9999), a.get("name", "").casefold())):
                  name = artist.get("name") or "Artist"
                  apath = artist_detail_path(name)
                  urls.append(apath)
                  shows = sorted([e for e in events if normalize(name) in event_artist_set(e)], key=lambda e: (e.get("startDate", ""), e.get("startTime", "")))
                  platforms = "".join([
                      platform_card("Instagram", instagram_url(artist), "Instagram link pending verification"),
                      platform_card("Spotify", spotify_url(artist), "Spotify link pending verification"),
                      platform_card("YouTube", youtube_url(artist), "YouTube link pending verification"),
                      platform_card("Website", website_url(artist), "Website link pending verification"),
                  ])
                  crumbs = [("Artists", BASE_PATH + "artists/"), (name, apath)]
                  body = f'''<section class="profile-section">{breadcrumb_html(crumbs)}<section class="profile-hero profile-hero-no-image"><div><p class="eyebrow">Artist profile</p><h1>{esc(name)}</h1><p class="profile-image-note">Artist image pending verification.</p><div class="profile-platforms">{platforms}</div><p class="profile-count">{len(shows)} upcoming U.S. show{'s' if len(shows) != 1 else ''} currently listed.</p></div></section><section class="calendar"><div class="calendar-heading"><div><p class="eyebrow">Verified listings</p><h2>Upcoming {esc(name)} Shows</h2></div><p class="results-count">{len(shows)} shows</p></div><div class="event-grid">{''.join(event_card(e, artists) for e in shows) if shows else '<div class="empty-panel">No upcoming U.S. shows are currently confirmed.</div>'}</div></section></section>'''
                  title = f"{name} Concerts & Tour Dates | The Kingdom Circuit"
                  description = f"Find upcoming {name} Christian hip-hop concerts, tour dates, festivals, and verified official show links across the United States."
                  schema = breadcrumb_schema(crumbs)
                  write_page(apath, page(title, description, apath, body, current="artists", jsonld=schema))
              return urls
          
          
          def generate_location_pages(events: list[dict], artists: list[dict]) -> list[str]:
              urls = []
              states: dict[str, list[dict]] = defaultdict(list)
              cities: dict[tuple[str, str], list[dict]] = defaultdict(list)
              for event in events:
                  if event.get("state"):
                      states[event["state"]].append(event)
                  if event.get("city") and event.get("state"):
                      cities[(event["city"], event["state"])].append(event)
              for code, shows in sorted(states.items()):
                  name = STATE_NAMES.get(code, code)
                  path = BASE_PATH + "shows/" + state_slug(code) + "/"
                  urls.append(path)
                  shows.sort(key=lambda e: (e.get("startDate", ""), e.get("startTime", "")))
                  crumbs = [("Shows", BASE_PATH + "shows/"), (name, path)]
                  body = f'''<section class="page-hero hero-compact">{breadcrumb_html(crumbs)}<p class="eyebrow">{esc(name)}</p><h1>Christian Hip-Hop Shows in {esc(name)}</h1><p class="hero-text">Browse upcoming verified CHH concerts, Christian rap shows, and festivals in {esc(name)}.</p></section><section class="calendar"><div class="calendar-heading"><div><p class="eyebrow">Verified listings</p><h2>Upcoming {esc(name)} Shows</h2></div><p class="results-count">{len(shows)} shows</p></div><div class="event-grid">{''.join(event_card(e, artists) for e in shows)}</div></section>'''
                  title = f"Christian Hip-Hop Shows in {name} | The Kingdom Circuit"
                  desc = f"Find upcoming Christian hip-hop and Christian rap concerts, festivals, and live events in {name}. Verified U.S. show listings with official links."
                  write_page(path, page(title, desc, path, body, current="shows", jsonld=breadcrumb_schema(crumbs)))
              for (city, code), shows in sorted(cities.items(), key=lambda x: (x[0][1], x[0][0].casefold())):
                  state_name = STATE_NAMES.get(code, code)
                  path = BASE_PATH + "shows/" + city_slug(city, code) + "/"
                  urls.append(path)
                  shows.sort(key=lambda e: (e.get("startDate", ""), e.get("startTime", "")))
                  state_path = BASE_PATH + "shows/" + state_slug(code) + "/"
                  crumbs = [("Shows", BASE_PATH + "shows/"), (state_name, state_path), (city, path)]
                  body = f'''<section class="page-hero hero-compact">{breadcrumb_html(crumbs)}<p class="eyebrow">{esc(city)}, {esc(code)}</p><h1>Christian Hip-Hop Shows in {esc(city)}</h1><p class="hero-text">Browse upcoming verified CHH concerts, Christian rap shows, and festivals in {esc(city)}, {esc(state_name)}.</p></section><section class="calendar"><div class="calendar-heading"><div><p class="eyebrow">Verified listings</p><h2>Upcoming {esc(city)} Shows</h2></div><p class="results-count">{len(shows)} shows</p></div><div class="event-grid">{''.join(event_card(e, artists) for e in shows)}</div></section>'''
                  title = f"Christian Hip-Hop Shows in {city}, {code} | The Kingdom Circuit"
                  desc = f"Find upcoming Christian hip-hop and Christian rap concerts, festivals, and live events in {city}, {state_name}. Verified show listings with official links."
                  write_page(path, page(title, desc, path, body, current="shows", jsonld=breadcrumb_schema(crumbs)))
              return urls
          
          
          def generate_month_pages(events: list[dict], artists: list[dict]) -> list[str]:
              urls = []
              months: dict[tuple[int, int], list[dict]] = defaultdict(list)
              for event in events:
                  try:
                      d = dt.date.fromisoformat(event.get("startDate", "")[:10])
                  except Exception:
                      continue
                  months[(d.year, d.month)].append(event)
              for (year, month), shows in sorted(months.items()):
                  d = dt.date(year, month, 1)
                  label = d.strftime("%B %Y")
                  slug = f"{d.strftime('%B').lower()}-{year}"
                  path = BASE_PATH + "shows/" + slug + "/"
                  urls.append(path)
                  shows.sort(key=lambda e: (e.get("startDate", ""), e.get("startTime", "")))
                  crumbs = [("Shows", BASE_PATH + "shows/"), (label, path)]
                  body = f'''<section class="page-hero hero-compact">{breadcrumb_html(crumbs)}<p class="eyebrow">Monthly calendar</p><h1>Christian Hip-Hop Shows in {esc(label)}</h1><p class="hero-text">Browse verified CHH concerts, Christian rap shows, and festivals scheduled for {esc(label)}.</p></section><section class="calendar"><div class="calendar-heading"><div><p class="eyebrow">Verified listings</p><h2>{esc(label)} Shows</h2></div><p class="results-count">{len(shows)} shows</p></div><div class="event-grid">{''.join(event_card(e, artists) for e in shows)}</div></section>'''
                  title = f"Christian Hip-Hop Shows in {label} | The Kingdom Circuit"
                  desc = f"Find Christian hip-hop and Christian rap concerts, festivals, and live events in {label}. Verified U.S. listings with official show links."
                  write_page(path, page(title, desc, path, body, current="month", jsonld=breadcrumb_schema(crumbs)))
              return urls
          
          
          def patch_js_links(path: pathlib.Path) -> None:
              if not path.exists():
                  return
              text = path.read_text(encoding="utf-8")
              helper = '''\nfunction seoSlug(value) { return String(value || "").trim().toLowerCase().replace(/&/g," and ").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"") || "item"; }\nfunction seoFNV(value) { let h=0x811c9dc5; const bytes=new TextEncoder().encode(String(value || "")); for (const b of bytes) { h ^= b; h = Math.imul(h,0x01000193) >>> 0; } return h.toString(16).padStart(8,"0").slice(0,6); }\nfunction seoEventSlug(event) { const parts=[seoSlug(event.title || "event"),event.startDate || "",seoSlug(event.city || "")].filter(Boolean); return `${parts.join("-")}-${seoFNV(event.id || JSON.stringify(event))}`; }\n'''
              if "function seoSlug(" not in text:
                  insert_at = text.find("let EVENTS")
                  text = text[:insert_at] + helper + text[insert_at:]
              text = re.sub(r'function eventDetailUrl\(event\) \{\s*return `\$\{BASE\}event/\?id=\$\{encodeURIComponent\(event\.id\)\}`;\s*\}',
                            'function eventDetailUrl(event) { return `${BASE}event/${seoEventSlug(event)}/`; }', text)
              text = re.sub(r'function artistProfileUrl\(name\) \{\s*return `\$\{BASE\}artists/profile/\?name=\$\{encodeURIComponent\(name\)\}`;\s*\}',
                            'function artistProfileUrl(name) { return `${BASE}artists/${seoSlug(name)}/`; }', text)
              text = text.replace('loading="lazy" style=', 'loading="lazy" decoding="async" width="1200" height="675" style=')
              path.write_text(text, encoding="utf-8")
          
          
          def patch_meta(path: pathlib.Path, title: str, description: str, canonical_path: str, schema: dict | None = None) -> None:
              if not path.exists():
                  return
              text = path.read_text(encoding="utf-8")
              text = re.sub(r'<title>.*?</title>', f'<title>{esc(title)}</title>', text, flags=re.S)
              text = re.sub(r'<meta name="description" content="[^"]*">', f'<meta name="description" content="{esc(description)}">', text)
              text = re.sub(r'<link rel="canonical"[^>]*>\s*', '', text)
              canonical = absolute_url(canonical_path)
              additions = f'  <link rel="canonical" href="{esc(canonical)}">\n  <meta property="og:title" content="{esc(title)}">\n  <meta property="og:description" content="{esc(description)}">\n  <meta property="og:url" content="{esc(canonical)}">\n'
              if schema:
                  additions += f'  <script type="application/ld+json">{json.dumps(schema, ensure_ascii=False, separators=(",", ":"))}</script>\n'
              text = text.replace('</head>', additions + '</head>')
              path.write_text(text, encoding="utf-8")
          
          
          def prerender_event_grid(path: pathlib.Path, shows: list[dict], artists: list[dict]) -> None:
              if not path.exists():
                  return
              text = path.read_text(encoding="utf-8")
              cards = ''.join(event_card(e, artists) for e in shows)
              text = text.replace('<div class="event-grid" data-event-grid></div>', f'<div class="event-grid" data-event-grid>{cards}</div>')
              text = re.sub(r'<div class="loading-panel" data-loading-panel>.*?</div>', '', text, flags=re.S)
              text = re.sub(r'<p class="results-count" data-results-count>.*?</p>', f'<p class="results-count" data-results-count>{len(shows)} shows</p>', text, flags=re.S)
              path.write_text(text, encoding="utf-8")
          
          
          def prerender_artist_grid(path: pathlib.Path, events: list[dict], artists: list[dict]) -> None:
              if not path.exists():
                  return
              by_artist = defaultdict(list)
              for event in events:
                  for name in event.get("artists", []):
                      by_artist[normalize(name)].append(event)
              cards = []
              enabled = sorted((a for a in artists if a.get("enabled") is not False), key=lambda a: (a.get("rosterOrder", 9999), a.get("name", "").casefold()))
              for artist in enabled:
                  name = artist.get("name", "")
                  shows = by_artist[normalize(name)]
                  cards.append(f'''<article class="artist-card artist-card-text" data-artist-card data-search="{esc(normalize(' '.join([name, *artist.get('aliases', [])])))}" data-has-shows="{'true' if shows else 'false'}"><a class="artist-visual artist-visual-empty" href="{artist_detail_path(name)}" aria-label="View {esc(name)}"></a><div class="artist-card-body"><h2><a href="{artist_detail_path(name)}">{esc(name)}</a></h2><p>{len(shows)} upcoming show{'s' if len(shows) != 1 else ''}</p><div class="artist-card-links">{compact_platform_link('Instagram', instagram_url(artist))}{compact_platform_link('Spotify', spotify_url(artist))}</div><div class="artist-card-footer"><a class="text-link" href="{artist_detail_path(name)}">View artist</a></div></div></article>''')
              text = path.read_text(encoding="utf-8")
              text = text.replace('<div class="artist-grid" data-artist-grid></div>', f'<div class="artist-grid" data-artist-grid>{"".join(cards)}</div>')
              text = re.sub(r'<div class="loading-panel" data-artist-loading>.*?</div>', '', text, flags=re.S)
              text = re.sub(r'<p class="results-count" data-artist-count>.*?</p>', f'<p class="results-count" data-artist-count>{len(enabled)} artists</p>', text, flags=re.S)
              path.write_text(text, encoding="utf-8")
          
          
          def write_static_js() -> None:
              (OUT / "seo-static.js").write_text('''"use strict";\nfunction setMenuOpen(open){const t=document.querySelector(".menu-toggle"),d=document.querySelector(".menu-drawer"),b=document.querySelector(".menu-backdrop");if(!t||!d||!b)return;t.setAttribute("aria-expanded",String(open));d.setAttribute("aria-hidden",String(!open));d.classList.toggle("open",open);b.hidden=!open;document.body.classList.toggle("menu-open",open)}\ndocument.querySelector(".menu-toggle")?.addEventListener("click",()=>setMenuOpen(document.querySelector(".menu-toggle")?.getAttribute("aria-expanded")!=="true"));document.querySelector(".menu-close")?.addEventListener("click",()=>setMenuOpen(false));document.querySelector(".menu-backdrop")?.addEventListener("click",()=>setMenuOpen(false));document.addEventListener("keydown",e=>{if(e.key==="Escape")setMenuOpen(false)});\n''', encoding="utf-8")
          
          
          def write_sitemap(urls: list[str]) -> None:
              now = TODAY.isoformat()
              unique = []
              seen = set()
              for path in urls:
                  u = absolute_url(path)
                  if u not in seen:
                      seen.add(u)
                      unique.append(u)
              xml = ['<?xml version="1.0" encoding="UTF-8"?>', '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">']
              for url in unique:
                  xml.append(f'  <url><loc>{html.escape(url)}</loc><lastmod>{now}</lastmod></url>')
              xml.append('</urlset>')
              (OUT / "sitemap.xml").write_text("\n".join(xml) + "\n", encoding="utf-8")
              robots = f"User-agent: *\nDisallow: /\nSitemap: {absolute_url(BASE_PATH + 'sitemap.xml')}\n" if TEST_MODE else f"User-agent: *\nAllow: /\nSitemap: {absolute_url('/sitemap.xml')}\n"
              (OUT / "robots.txt").write_text(robots, encoding="utf-8")
          
          
          def copy_repo() -> None:
              if OUT.exists():
                  shutil.rmtree(OUT)
              OUT.mkdir()
              for item in REPO.iterdir():
                  if item.name in {".git", ".github", "_site"}:
                      continue
                  target = OUT / item.name
                  if item.is_dir():
                      shutil.copytree(item, target)
                  else:
                      shutil.copy2(item, target)
          
          
          def validate(urls: list[str], events: list[dict], artists: list[dict]) -> None:
              if len(set(urls)) != len(urls):
                  dupes = [u for u in set(urls) if urls.count(u) > 1]
                  raise RuntimeError(f"Duplicate generated URLs: {dupes[:10]}")
              if len(artists) < 250:
                  raise RuntimeError(f"Artist roster unexpectedly small: {len(artists)}")
              if len(events) < 20:
                  raise RuntimeError(f"Current event set unexpectedly small: {len(events)}")
              # Confirm baseline assets exist and were not replaced by this build.
              for required in ["assets/logo.png", "styles.css", "index.html", "app-v6.js"]:
                  if not (OUT / required).exists():
                      raise RuntimeError(f"Required test asset missing: {required}")
              sample_event = next((OUT / fs_relative(p) / "index.html" for p in urls if "/event/" in p), None)
              if not sample_event or not sample_event.exists():
                  raise RuntimeError("No static event page generated")
              event_text = sample_event.read_text(encoding="utf-8")
              for token in ['MusicEvent', 'rel="canonical"', 'noindex,nofollow', 'Official details']:
                  if token not in event_text:
                      raise RuntimeError(f"Event SEO page missing {token}")
              sample_artist = next((OUT / fs_relative(p) / "index.html" for p in urls if "/artists/" in p and p != BASE_PATH + "artists/"), None)
              if not sample_artist or not sample_artist.exists():
                  raise RuntimeError("No static artist page generated")
              # Guardrail: test pages must never be indexable.
              for html_file in list(OUT.rglob("index.html"))[:1000]:
                  text = html_file.read_text(encoding="utf-8", errors="ignore")
                  if "noindex" not in text:
                      raise RuntimeError(f"Test page accidentally indexable: {html_file.relative_to(OUT)}")
              print(f"Validated {len(events)} current events, {len(artists)} artists, {len(urls)} sitemap URLs.")
          
          
          def main() -> None:
              copy_repo()
              # Fallback snapshots already exist in the test repo.
              local_events = REPO / "events.json"
              local_artists = REPO / "artists.json"
              events = fetch_json(LIVE_EVENTS, local_events)
              artists = apply_artist_overrides(fetch_json(LIVE_ARTISTS, local_artists))
              supplemental_path = REPO / "supplemental-events-v6.json"
              if not supplemental_path.exists():
                  supplemental_path = REPO / "supplemental-events.json"
              supplemental = json.loads(supplemental_path.read_text(encoding="utf-8")) if supplemental_path.exists() else []
              merged = merge_event_lists(events, supplemental)
              current_events = sorted([e for e in merged if is_current_event(e)], key=lambda e: (e.get("startDate", ""), e.get("startTime", ""), e.get("title", "")))
          
              # Refresh local fallback copies in the deployment artifact only.
              (OUT / "events.json").write_text(json.dumps(events, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
              (OUT / "artists.json").write_text(json.dumps(artists, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          
              # Patch JS links in the deployment artifact only, preserving repository source files.
              for js in ("app.js", "app-v5.js", "app-v6.js"):
                  patch_js_links(OUT / js)
          
              # Improve metadata on the existing user-facing pages without changing layout.
              organization_schema = {"@context":"https://schema.org","@type":"Organization","name":"The Kingdom Circuit","url":absolute_url(BASE_PATH),"description":"Christian hip-hop live-show discovery platform."}
              patch_meta(OUT / "index.html", "Christian Hip-Hop Shows & Concerts | The Kingdom Circuit", "Find verified Christian hip-hop concerts, Christian rap shows, festivals, tours, and live events across the United States.", BASE_PATH, organization_schema)
              patch_meta(OUT / "shows/index.html", "Christian Hip-Hop Shows & Concerts | The Kingdom Circuit", "Browse upcoming verified Christian hip-hop concerts, Christian rap shows, tours, festivals, and live events across the United States.", BASE_PATH + "shows/")
              patch_meta(OUT / "shows/this-month/index.html", f"Christian Hip-Hop Shows in {TODAY.strftime('%B %Y')} | The Kingdom Circuit", f"Find verified Christian hip-hop concerts, Christian rap shows, and festivals happening in {TODAY.strftime('%B %Y')}.", BASE_PATH + "shows/this-month/")
              patch_meta(OUT / "festivals/index.html", "Christian Hip-Hop Festivals | The Kingdom Circuit", "Discover upcoming U.S. festivals with confirmed Christian hip-hop and Christian rap artists, dates, locations, and official event links.", BASE_PATH + "festivals/")
              patch_meta(OUT / "new-shows/index.html", "New Christian Hip-Hop Shows | The Kingdom Circuit", "See Christian hip-hop concerts and festivals recently added to The Kingdom Circuit verified U.S. show calendar.", BASE_PATH + "new-shows/")
              patch_meta(OUT / "artists/index.html", "Christian Hip-Hop Artist Directory | The Kingdom Circuit", "Browse Christian hip-hop artists monitored by The Kingdom Circuit and find verified upcoming concerts, Spotify profiles, Instagram links, and official sites.", BASE_PATH + "artists/")
          
              # Pre-render existing grids so Google and no-JS clients see meaningful HTML immediately.
              prerender_event_grid(OUT / "index.html", current_events, artists)
              prerender_event_grid(OUT / "shows/index.html", current_events, artists)
              month_events = [e for e in current_events if e.get("startDate", "").startswith(TODAY.strftime("%Y-%m"))]
              prerender_event_grid(OUT / "shows/this-month/index.html", month_events, artists)
              prerender_event_grid(OUT / "festivals/index.html", [e for e in current_events if e.get("eventType") == "festival"], artists)
              cutoff = TODAY - dt.timedelta(days=14)
              new_events = []
              for e in current_events:
                  try:
                      seen = dt.datetime.fromisoformat(str(e.get("firstSeen", "")).replace("Z", "+00:00")).date()
                      if seen >= cutoff:
                          new_events.append(e)
                  except Exception:
                      pass
              prerender_event_grid(OUT / "new-shows/index.html", new_events, artists)
              prerender_artist_grid(OUT / "artists/index.html", current_events, artists)
          
              write_static_js()
          
              # Static search entry points.
              generated = []
              generated += generate_event_pages(current_events, artists)
              generated += generate_artist_pages(current_events, artists)
              generated += generate_location_pages(current_events, artists)
              generated += generate_month_pages(current_events, artists)
          
              core = [BASE_PATH, BASE_PATH + "shows/", BASE_PATH + "shows/this-month/", BASE_PATH + "festivals/", BASE_PATH + "new-shows/", BASE_PATH + "artists/", BASE_PATH + "submit/"]
              all_urls = core + generated
              write_sitemap(all_urls)
              validate(all_urls, current_events, artists)
          
              manifest = {
                  "generatedAt": dt.datetime.now(dt.timezone.utc).isoformat(),
                  "mode": "test-noindex",
                  "events": len(current_events),
                  "artists": len([a for a in artists if a.get("enabled") is not False]),
                  "urls": len(all_urls),
                  "eventPages": len([u for u in generated if "/event/" in u]),
                  "artistPages": len([u for u in generated if "/artists/" in u]),
                  "note": "Test build remains noindex. Assets/logo are copied unchanged from the test repository.",
              }
              (OUT / "seo-build-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
              print(json.dumps(manifest, indent=2))
          
          
          if __name__ == "__main__":
              main()
          PY
          python /tmp/build_kc_seo.py

      - name: Regression-check generated site
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re
          root = pathlib.Path("_site")
          manifest = json.loads((root / "seo-build-manifest.json").read_text())
          assert manifest["artists"] >= 250, manifest
          assert manifest["events"] >= 20, manifest
          assert manifest["eventPages"] >= 20, manifest
          assert manifest["artistPages"] >= 250, manifest
          assert "Disallow: /" in (root / "robots.txt").read_text()
          assert (root / "sitemap.xml").exists()
          assert (root / "assets/logo.png").exists()
          home = (root / "index.html").read_text()
          assert "The Kingdom Circuit exists to connect people with CHH music" in home
          assert 'noindex,nofollow' in home
          assert 'rel="canonical"' in home
          event = next((root / "event").glob("*/index.html"))
          event_text = event.read_text()
          assert '"@type":"MusicEvent"' in event_text
          assert "Official details" in event_text
          artist = next(p for p in (root / "artists").glob("*/index.html") if p.parent.name != "profile")
          artist_text = artist.read_text()
          assert "upcoming U.S. show" in artist_text
          print("Regression checks passed:", manifest)
          PY

          rm -rf /tmp/kc-pages-qa
          mkdir -p /tmp/kc-pages-qa/kingdom-circuit-test
          cp -a _site/. /tmp/kc-pages-qa/kingdom-circuit-test/
          python3 -m http.server 8765 --directory /tmp/kc-pages-qa >/tmp/kc-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          curl -fsS http://127.0.0.1:8765/kingdom-circuit-test/ >/dev/null
          curl -fsS http://127.0.0.1:8765/kingdom-circuit-test/shows/ >/dev/null
          curl -fsS http://127.0.0.1:8765/kingdom-circuit-test/artists/ >/dev/null
          SAMPLE_EVENT=$(find _site/event -mindepth 2 -maxdepth 2 -name index.html | head -1 | sed 's#_site/##;s#index.html##')
          curl -fsS "http://127.0.0.1:8765/kingdom-circuit-test/${SAMPLE_EVENT}" >/dev/null
          kill $SERVER_PID
          trap - EXIT

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy SEO test site
        id: deployment
        uses: actions/deploy-pages@v4
