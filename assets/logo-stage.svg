<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Kingdom Circuit</title>
  <desc id="desc">Kingdom Circuit wordmark inside a symmetrical concert stage truss with twin speakers and stage floor.</desc>
  <g fill="none" stroke="#fff" stroke-width="17" stroke-linecap="square" stroke-linejoin="miter">
    <!-- top truss -->
    <rect x="105" y="70" width="990" height="112"/>
    <path d="M105 70L190 182L330 70L470 182L600 70L730 182L870 70L1010 182L1095 70"/>
    <path d="M190 70V182M1010 70V182"/>

    <!-- side truss rails -->
    <path d="M105 182V560M190 182V560M1010 182V560M1095 182V560"/>
    <path d="M105 182L190 245L105 308L190 371L105 434L190 497L105 560"/>
    <path d="M1095 182L1010 245L1095 308L1010 371L1095 434L1010 497L1095 560"/>

    <!-- speaker top caps -->
    <path d="M78 590H250L225 560H103Z"/>
    <path d="M950 590H1122L1097 560H975Z"/>

    <!-- speaker cabinets -->
    <rect x="78" y="590" width="172" height="235"/>
    <rect x="950" y="590" width="172" height="235"/>
    <circle cx="164" cy="660" r="52"/><circle cx="164" cy="756" r="52"/>
    <circle cx="1036" cy="660" r="52"/><circle cx="1036" cy="756" r="52"/>
    <circle cx="164" cy="660" r="15" fill="#fff"/><circle cx="164" cy="756" r="15" fill="#fff"/>
    <circle cx="1036" cy="660" r="15" fill="#fff"/><circle cx="1036" cy="756" r="15" fill="#fff"/>

    <!-- stage floor -->
    <path d="M42 842H1158" stroke-width="18"/>
  </g>

  <g fill="#fff" font-family="Arial Narrow,Impact,Haettenschweiler,Arial,sans-serif" font-stretch="condensed" font-weight="900" text-anchor="middle">
    <text x="600" y="430" font-size="196" letter-spacing="-7">KINGDOM</text>
    <text x="600" y="603" font-size="188" letter-spacing="-7">CIRCUIT</text>
  </g>
</svg>